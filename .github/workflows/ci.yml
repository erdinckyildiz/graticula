# Continuous integration.
#
# D-29: "there is no CI, so nothing runs the checks a published promise depends
# on. No workflow of any kind: every test runs because somebody remembered."
# ADR-025 commits in writing to fixing reported vulnerabilities within ninety
# days, and until this file existed nothing reported one.
#
# **This project's suites fail rather than skip when their subject is absent**,
# which is deliberate and stated in PostgresFixture: a test that goes green with
# nothing under it is worse than no test. That makes CI's shape a consequence
# rather than a choice — a job either provides what a suite needs or must not
# run it, and the coverage this workflow does not reach is named in the summary
# step rather than left to be inferred from a green tick.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: build and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: restore
        run: dotnet restore gis-server.sln

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are already on in
      # Directory.Build.props, so this is the style gate as well as the build.
      - name: build
        run: dotnet build gis-server.sln -c Release --no-restore

      # <b>ADR-025's ninety-day promise needs something that reports a dirty
      # tree.</b> `dotnet list package --vulnerable` prints its findings and
      # exits zero whatever it finds, so the exit code is derived from the
      # output rather than trusted.
      - name: vulnerable packages
        run: |
          dotnet list gis-server.sln package --vulnerable --include-transitive \
            > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -qE '^\s+>' vulnerable.txt; then
            echo "::error::A dependency has a reported vulnerability. ADR-025 commits to fixing these within ninety days."
            exit 1
          fi

      - name: deprecated packages
        run: dotnet list gis-server.sln package --deprecated

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: build
        run: dotnet build gis-server.sln -c Release

      # The five suites that need nothing outside the process. Listed one per
      # line rather than run as a solution-wide `dotnet test`, because the other
      # three FAIL without their subject and a wildcard would turn that
      # deliberate design into a permanently red build.
      - name: architecture
        run: dotnet test tests/GisServer.Architecture.Tests -c Release --no-build

      - name: core
        run: dotnet test tests/GisServer.Core.Tests -c Release --no-build

      - name: arcgis api
        run: dotnet test tests/GisServer.Api.ArcGis.Tests -c Release --no-build

      - name: platform
        run: dotnet test tests/GisServer.Platform.Tests -c Release --no-build

      - name: argon2
        run: dotnet test tests/GisServer.Security.Argon2.Tests -c Release --no-build

  datastore:
    name: datastore
    runs-on: ubuntu-latest
    needs: build

    services:
      postgis:
        # Pinned to the version developed against. PostGIS 3.4 with PROJ 7.2 is
        # what the oracle tests compare themselves to, and a newer PROJ can
        # legitimately choose a different transformation path — which would look
        # like our arithmetic drifting.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GISSERVER_TEST_PG: "Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: build
        run: dotnet build gis-server.sln -c Release

      # <b>Two suites discover a geometry table and compare against PostGIS on
      # whatever they find.</b> A developer machine has real data; CI has none,
      # and these suites fail loudly rather than skip. The generated corpus is a
      # weaker check than the local one and tools/ci-corpus.sql says so in full.
      - name: seed the geometry corpus
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=gis psql -h 127.0.0.1 -U gis -d gis -v ON_ERROR_STOP=1 \
            -f tools/ci-corpus.sql

      # PostgresFixture creates a private schema per test class and migrates it
      # itself, so nothing has to bootstrap the platform store here.
      - name: platform store and providers
        run: dotnet test tests/GisServer.Platform.Postgres.Tests -c Release --no-build

      # Host.Tests needs the overlay worker, which the host build copies into an
      # 'overlay' directory beside itself. If that copy step ever breaks, these
      # fail with a message saying exactly that rather than with 503s.
      - name: host and geometry worker
        run: dotnet test tests/GisServer.Host.Tests -c Release --no-build

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    needs: build

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GISSERVER_TEST_URL: "https://127.0.0.1:8443"
      GISSERVER_TEST_USER: "ci"
      GISSERVER_TEST_PASSWORD: "conformance-run-password"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: dotnet build gis-server.sln -c Release

      # <b>The schema, then the migration, then the server.</b> Migrating is an
      # explicit operation on purpose (ADR-016 §4b: refuse rather than migrate),
      # so a server pointed at an empty store refuses to start and says so. The
      # schema has to exist first: the migrator creates tables, not the namespace
      # it was told to put them in, and against a brand-new database it fails
      # with Postgres's own "no schema has been selected to create in" — D-36.
      - name: create the platform schema
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=gis psql -h 127.0.0.1 -U gis -d gis -v ON_ERROR_STOP=1             -c 'create schema if not exists gisserver;'

      - name: migrate
        env:
          GisServer__PlatformStore: "Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis;SearchPath=gisserver"
          GisServer__SecretKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          src/GisServer.Host/bin/Release/net9.0/GisServer.Host migrate --apply

      # <b>The server runs from its build output, not from `dotnet run`.</b> The
      # overlay worker is copied into an 'overlay' directory beside the host by
      # the host's own build, and a run that starts from source can miss it —
      # which is a packaging regression this job should catch rather than route
      # around.
      #
      # <b>The key is generated per run and never reused.</b> The migration step
      # above uses a placeholder because it seals nothing; this one seals data
      # source credentials, and a fixed key in a public workflow would be a
      # credential in the repository.
      - name: start the server
        run: |
          GisServer__PlatformStore='Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis;SearchPath=gisserver' \
          GisServer__SecretKey="$(head -c 32 /dev/urandom | base64 -w0)" \
          GisServer__Port=8443 \
            nohup src/GisServer.Host/bin/Release/net9.0/GisServer.Host \
              > server.log 2>&1 &
          echo "started, waiting for the setup token"

      # The first-start token is printed once, to the log, and is single-use.
      # There is no other way in: everything is refused until an administrator
      # exists, which is the point of the design (ADR-015).
      - name: take the setup token from the log
        run: |
          for attempt in $(seq 1 60); do
            token=$(grep -oE '^ {4}[A-Za-z0-9._-]{20,}$' server.log | head -1 | tr -d ' ') || true
            if [ -n "$token" ]; then
              echo "SETUP_TOKEN=$token" >> "$GITHUB_ENV"
              echo "found the setup token after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::No setup token appeared in server.log within 60s."
          tail -50 server.log
          exit 1

      - name: seed the fixtures
        run: |
          python tools/seed-conformance.py \
            --url "$GISSERVER_TEST_URL" \
            --name "$GISSERVER_TEST_USER" \
            --password "$GISSERVER_TEST_PASSWORD" \
            --setup-token "$SETUP_TOKEN" \
            --prefix ci \
            --github-env "$GITHUB_ENV"

      - name: conformance
        run: dotnet test tests/GisServer.Conformance.Tests -c Release --no-build

      # <b>The server's own log, whatever happened.</b> A conformance failure is
      # usually a 500 with a stack trace on the other side of the wire, and
      # without this the only evidence is "an ArcGIS client stops here".
      - name: server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: warn

  registers:
    name: registers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # <b>The condition count is derived, never remembered.</b> CLAUDE.md
      # records why: the number was "roughly twenty-five" and was actually 69,
      # and two tools disagreed because the discharge rule lived in both. This
      # runs the one implementation so a malformed register is a failed build
      # rather than a wrong number on a status page.
      - name: ADR conditions
        run: python tools/conditions.py

      # <b>The numbers, not a diff.</b> The status page stamps the commit and the
      # minute it was generated, so regenerating it and diffing reports a change
      # on every run whatever the registers say — the first version of this
      # workflow did exactly that and would have been permanently red.
      # registers-check compares the counts instead, which is what actually goes
      # stale when somebody edits a register and forgets to regenerate. Verified
      # by breaking it: 29/100 was changed to 28/100 and the check named the
      # mismatch and the command that fixes it.
      - name: status page is not stale
        run: python tools/registers-check.py

      - name: status page still generates
        run: python tools/status-page.py docs/status.html

  coverage-gap:
    name: what CI does not cover
    runs-on: ubuntu-latest
    needs: [unit, datastore, conformance]

    steps:
      # <b>Stated, because a green tick is read as "everything passed".</b> The
      # conformance suite walks the request sequence a real ArcGIS client makes
      # against a running, seeded server, and nothing here starts one. Until a
      # seed script exists, roughly a sixth of the suite does not run in CI, and
      # that fact belongs on the build page rather than in a debt register
      # nobody opens.
      - name: say what is missing
        run: |
          {
            echo "### What this workflow does and does not reach"
            echo
            echo "All eight suites run: five that need nothing, two against a PostGIS"
            echo "service container, and the conformance suite against a server this"
            echo "workflow starts and seeds with \`tools/seed-conformance.py\`."
            echo
            echo "**Still not reached, and worth knowing:**"
            echo
            echo "- **The geometry corpus is generated, not real.** \`tools/ci-corpus.sql\`"
            echo "  makes sixty irregular polygons; real cadastral data has collinear runs"
            echo "  and near-degenerate slivers that generated shapes do not, and those are"
            echo "  what found the Douglas–Peucker ring defects."
            echo "- **One PostGIS version.** Pinned to 16-3.4 with PROJ 7.2, which is what"
            echo "  the oracle tests were written against. A newer PROJ may legitimately"
            echo "  pick a different transformation path."
            echo "- **No performance gate.** D-30: the feature query path has never been"
            echo "  measured, here or anywhere."
          } >> "$GITHUB_STEP_SUMMARY"
