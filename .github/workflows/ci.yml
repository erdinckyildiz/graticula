# Continuous integration.
#
# D-29: "there is no CI, so nothing runs the checks a published promise depends
# on. No workflow of any kind: every test runs because somebody remembered."
# ADR-025 commits in writing to fixing reported vulnerabilities within ninety
# days, and until this file existed nothing reported one.
#
# **This project's suites fail rather than skip when their subject is absent**,
# which is deliberate and stated in PostgresFixture: a test that goes green with
# nothing under it is worse than no test. That makes CI's shape a consequence
# rather than a choice — a job either provides what a suite needs or must not
# run it, and the coverage this workflow does not reach is named in the summary
# step rather than left to be inferred from a green tick.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: build and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: restore
        run: dotnet restore graticula.sln

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are already on in
      # Directory.Build.props, so this is the style gate as well as the build.
      - name: build
        run: dotnet build graticula.sln -c Release --no-restore

      # <b>The dependency gate lives in security.yml, not here.</b> It was in
      # both for a day, and two copies of one gate is how they come to
      # disagree: somebody tightens the pattern in one file and the other
      # keeps passing. security.yml runs on push and pull_request as well as
      # nightly, so nothing is lost by removing it from this build — and the
      # nightly is the part that matters, because a vulnerability is
      # disclosed on somebody else's schedule and a dependency clean at the
      # last push is not a dependency clean today.

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: build
        run: dotnet build graticula.sln -c Release

      # The five suites that need nothing outside the process. Listed one per
      # line rather than run as a solution-wide `dotnet test`, because the other
      # three FAIL without their subject and a wildcard would turn that
      # deliberate design into a permanently red build.
      - name: architecture
        run: dotnet test tests/Graticula.Architecture.Tests -c Release --no-build

      - name: core
        run: dotnet test tests/Graticula.Core.Tests -c Release --no-build

      - name: arcgis api
        run: dotnet test tests/Graticula.Api.ArcGis.Tests -c Release --no-build

      - name: platform
        run: dotnet test tests/Graticula.Platform.Tests -c Release --no-build

      - name: argon2
        run: |
          dotnet test tests/Graticula.Security.Argon2.Tests -c Release --no-build \
            --filter 'Needs!=QuietMachine'

  datastore:
    name: datastore
    runs-on: ubuntu-latest
    needs: build

    services:
      postgis:
        # Pinned to the version developed against. PostGIS 3.4 with PROJ 7.2 is
        # what the oracle tests compare themselves to, and a newer PROJ can
        # legitimately choose a different transformation path — which would look
        # like our arithmetic drifting.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GRATICULA_TEST_PG: "Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: build
        run: dotnet build graticula.sln -c Release

      # <b>Two suites discover a geometry table and compare against PostGIS on
      # whatever they find.</b> A developer machine has real data; CI has none,
      # and these suites fail loudly rather than skip. The generated corpus is a
      # weaker check than the local one and tools/ci-corpus.sql says so in full.
      - name: seed the geometry corpus
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=gis psql -h 127.0.0.1 -U gis -d gis -v ON_ERROR_STOP=1 \
            -f tools/ci-corpus.sql

      # PostgresFixture creates a private schema per test class and migrates it
      # itself, so nothing has to bootstrap the platform store here.
      #
      # <b>Three classes are excluded and the next step says which — ADR-048.</b>
      # They read `public.planet_osm_polygon` and `public.planet_osm_line`, an
      # osm2pgsql schema that is a real extract on a developer machine and nothing
      # here. They fail rather than skip when it is absent, which is correct and is
      # why they cannot simply run. Seeding a stand-in was tried on 2026-08-25 and
      # abandoned: the suites want 500 single-ring polygons, multi-ring ones, a
      # `name` column, a second table and an index in the query plan, and building
      # that is inventing a fake OSM database so a gate can go green on data it was
      # written not to trust.
      - name: platform store and providers
        run: |
          dotnet test tests/Graticula.Platform.Postgres.Tests -c Release --no-build \
            --filter 'Needs!=RealCorpus'

      # <b>Said out loud, because a gate that is silent about what it skipped
      # claims more than it proved.</b> §67's warning, applied to ourselves: the
      # cheapest way for CI to become a lie is for an exclusion to be added once
      # and never mentioned again.
      - name: say what CI did not run
        if: always()
        run: |
          echo "Every class that names something CI cannot give it, and what:"
          echo
          grep -rhoE 'Trait\("Needs", "[A-Za-z]+"\)' tests/ | sort -u | sed 's/^/  /'
          echo
          grep -rlE 'Trait\("Needs", "[A-Za-z]+"\)' tests/ | sort | sed 's/^/  /'
          echo
          echo "RealCorpus   compares this server against PostGIS on a real"
          echo "             OpenStreetMap extract. CI has none, so these run"
          echo "             nowhere here and CI does not prove what they prove."
          echo "QuietMachine timing assertions. A shared runner measures its"
          echo "             neighbours, so these run nowhere here either."
          echo "RunningHost  needs a server, not just a database. NOT skipped —"
          echo "             run in the conformance job, which starts one."
          echo
          echo "Run the two that CI cannot, on a machine that can:"
          echo
          echo "  dotnet test <project> --filter 'Needs=RealCorpus'"
          echo "  dotnet test <project> --filter 'Needs=QuietMachine'"
          echo
          echo
          echo "ADR-048 §5b and Q-117."

      # Host.Tests needs the overlay worker, which the host build copies into an
      # 'overlay' directory beside itself. If that copy step ever breaks, these
      # fail with a message saying exactly that rather than with 503s.
      #
      # <b>`Needs=RunningHost` is excluded here and run in `conformance` instead
      # — ADR-048 §5a.</b> This job has a database and no server; those tests read
      # `pg_stat_activity` for the sessions a running host holds. They are not
      # dropped, they are moved to the job that can satisfy them.
      - name: host and geometry worker
        run: |
          dotnet test tests/Graticula.Host.Tests -c Release --no-build \
            --filter 'Needs!=RunningHost&Needs!=RealCorpus'

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    needs: build

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GRATICULA_TEST_URL: "https://127.0.0.1:8443"
      GRATICULA_TEST_USER: "ci"
      GRATICULA_TEST_PASSWORD: "conformance-run-password"

      # <b>Three more, and their absence cost eight failures on the first CI run
      # that reached this suite — 2026-08-25.</b> Every one of them is read by a
      # class that FAILS rather than skips when it is unset, deliberately, because
      # a suite that goes quiet when its subject is missing is a suite that proves
      # nothing. So the refusals were correct and the job was underspecified.
      #
      # `_PG` lets the data-source lifecycle tests point a registration at a real
      # database; the `datastore` job already sets the same string.
      # `_LOG` is where the server writes, so the suites that assert a token never
      # reaches the log have something to read.
      GRATICULA_TEST_PG: "Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis"
      GRATICULA_TEST_LOG: "server.log"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: dotnet build graticula.sln -c Release

      # <b>Named rather than assumed, and reported rather than checked.</b>
      # ubuntu-latest carries Chrome today; a job that depends on that silently is
      # a job that breaks with the image, and one that greps for a particular
      # binary breaks on the day the image ships Chromium instead. So this prints
      # what is there and lets the suite's own message be the failure — DevTools
      # .FindChrome names GRATICULA_TEST_CHROME when it finds nothing.
      - name: which browser the console suite will drive
        run: |
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            path=$(command -v "$candidate" || true)
            [ -n "$path" ] && echo "$path -- $("$path" --version 2>&1 | head -1)"
          done
          true

      # <b>The schema, then the migration, then the server.</b> Migrating is an
      # explicit operation on purpose (ADR-016 §4b: refuse rather than migrate),
      # so a server pointed at an empty store refuses to start and says so. The
      # schema has to exist first: the migrator creates tables, not the namespace
      # it was told to put them in, and against a brand-new database it fails
      # with Postgres's own "no schema has been selected to create in" — D-36.
      - name: create the platform schema
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=gis psql -h 127.0.0.1 -U gis -d gis -v ON_ERROR_STOP=1             -c 'create schema if not exists gisserver;'

      - name: migrate
        env:
          Graticula__PlatformStore: "Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis;SearchPath=gisserver"
          Graticula__SecretKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          src/Graticula.Host/bin/Release/net9.0/Graticula.Host migrate --apply

      # <b>The server runs from its build output, not from `dotnet run`.</b> The
      # overlay worker is copied into an 'overlay' directory beside the host by
      # the host's own build, and a run that starts from source can miss it —
      # which is a packaging regression this job should catch rather than route
      # around.
      #
      # <b>The key is generated per run and never reused.</b> The migration step
      # above uses a placeholder because it seals nothing; this one seals data
      # source credentials, and a fixed key in a public workflow would be a
      # credential in the repository.
      - name: start the server
        run: |
          Graticula__PlatformStore='Host=127.0.0.1;Port=5432;Database=gis;Username=gis;Password=gis;SearchPath=gisserver' \
          Graticula__SecretKey="$(head -c 32 /dev/urandom | base64 -w0)" \
          Graticula__Port=8443 \
            nohup src/Graticula.Host/bin/Release/net9.0/Graticula.Host \
              > server.log 2>&1 &
          echo "started, waiting for the setup token"

      # The first-start token is printed once, to the log, and is single-use.
      # There is no other way in: everything is refused until an administrator
      # exists, which is the point of the design (ADR-015).
      # <b>Any indentation, not exactly four spaces.</b> This matched `^ {4}` until
      # 2026-08-25 and the first CI run this repository ever completed failed on it:
      # the token line is indented four spaces in a local `server.log` and ten in
      # CI's, so the pattern that was written against one worked on one. The step's
      # own `tail -50` printed the token it had just failed to find, which is the
      # tell -- a search that cannot see what its own error message shows.
      #
      # The token is the only line in the log that is whitespace then a single run
      # of 20+ token characters: every other indented line is a sentence and has
      # spaces in it. Verified against a real log rather than reasoned about.
      - name: take the setup token from the log
        run: |
          for attempt in $(seq 1 60); do
            token=$(grep -oE '^[[:space:]]+[A-Za-z0-9._-]{20,}[[:space:]]*$' server.log               | head -1 | tr -d '[:space:]') || true
            if [ -n "$token" ]; then
              echo "SETUP_TOKEN=$token" >> "$GITHUB_ENV"
              echo "found the setup token after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::No setup token appeared in server.log within 60s."
          tail -50 server.log
          exit 1

      - name: seed the fixtures
        run: |
          # <b>`--opt=value`, because a setup token can begin with a hyphen.</b>
          # It is base64url, so `-` and `_` are in its alphabet, and one starting
          # `-BQMpKt…` made argparse read it as an option and refuse -- *expected one
          # argument*. The separated form works for every token that happens not to
          # start with `-`, which is most of them, which is why this survived until a
          # run produced one that did. The first CI run to get this far found it.
          python tools/seed-conformance.py \
            --url="$GRATICULA_TEST_URL" \
            --name="$GRATICULA_TEST_USER" \
            --password="$GRATICULA_TEST_PASSWORD" \
            --setup-token="$SETUP_TOKEN" \
            --prefix=ci \
            --github-env="$GITHUB_ENV"

      - name: conformance
        run: dotnet test tests/Graticula.Conformance.Tests -c Release --no-build

      # <b>The tests the datastore job could not run, in the job that can — ADR-048
      # §5a.</b> A server is up by now, so its background pollers hold the sessions
      # `PollerPoolTests` looks for. Excluding a test in one job and never running
      # it in another is how an exclusion becomes a deletion.
      - name: the tests that need a running host
        run: |
          dotnet test tests/Graticula.Host.Tests -c Release --no-build \
            --filter 'Needs=RunningHost'

      # <b>The console, in a real browser, in this job because this is the job with
      # a server.</b> D-59: four console defects in two days, every one found by the
      # owner pressing a button, every one a click deep. The suite drives headless
      # Chrome over the DevTools protocol — no automation package, and none needed
      # on this runner, which ships Chrome already. If a future image does not, the
      # suite FAILS and says which variable to set rather than going quietly green.
      - name: console
        run: dotnet test tests/Graticula.Console.Tests -c Release --no-build

      # <b>The server's own log, whatever happened.</b> A conformance failure is
      # usually a 500 with a stack trace on the other side of the wire, and
      # without this the only evidence is "an ArcGIS client stops here".
      - name: server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: warn

  registers:
    name: registers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # <b>The condition count is derived, never remembered.</b> CLAUDE.md
      # records why: the number was "roughly twenty-five" and was actually 69,
      # and two tools disagreed because the discharge rule lived in both. This
      # runs the one implementation so a malformed register is a failed build
      # rather than a wrong number on a status page.
      - name: ADR conditions
        run: python tools/conditions.py

      # <b>The numbers, not a diff.</b> The status page stamps the commit and the
      # minute it was generated, so regenerating it and diffing reports a change
      # on every run whatever the registers say — the first version of this
      # workflow did exactly that and would have been permanently red.
      # registers-check compares the counts instead, which is what actually goes
      # stale when somebody edits a register and forgets to regenerate. Verified
      # by breaking it: 29/100 was changed to 28/100 and the check named the
      # mismatch and the command that fixes it.
      - name: status page is not stale
        run: python tools/registers-check.py

      - name: status page still generates
        run: python tools/status-page.py docs/status.html

  coverage-gap:
    name: what CI does not cover
    runs-on: ubuntu-latest
    needs: [unit, datastore, conformance]

    steps:
      # <b>Stated, because a green tick is read as "everything passed".</b> The
      # conformance suite walks the request sequence a real ArcGIS client makes
      # against a running, seeded server, and nothing here starts one. Until a
      # seed script exists, roughly a sixth of the suite does not run in CI, and
      # that fact belongs on the build page rather than in a debt register
      # nobody opens.
      - name: say what is missing
        run: |
          {
            echo "### What this workflow does and does not reach"
            echo
            echo "All nine suites run: five that need nothing, two against a PostGIS"
            echo "service container, and the conformance and console suites against a"
            echo "server this workflow starts and seeds with"
            echo "\`tools/seed-conformance.py\`."
            echo
            echo "**Still not reached, and worth knowing:**"
            echo
            echo "- **The geometry corpus is generated, not real.** \`tools/ci-corpus.sql\`"
            echo "  makes sixty irregular polygons; real cadastral data has collinear runs"
            echo "  and near-degenerate slivers that generated shapes do not, and those are"
            echo "  what found the Douglas–Peucker ring defects."
            echo "- **One PostGIS version.** Pinned to 16-3.4 with PROJ 7.2, which is what"
            echo "  the oracle tests were written against. A newer PROJ may legitimately"
            echo "  pick a different transformation path."
            echo "- **No performance gate.** D-30: the feature query path has never been"
            echo "  measured, here or anywhere."
          } >> "$GITHUB_STEP_SUMMARY"
