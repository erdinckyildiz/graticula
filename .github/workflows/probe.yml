# The smallest workflow GitHub will accept, and it exists to answer one question.
#
# D-63: every run this repository has ever produced is a 0-second
# `startup_failure`. The row records the likely cause as an account-level block,
# on the grounds that the two real workflow files were checked locally and are
# structurally sound. That reasoning cannot distinguish two very different
# causes, and this file can: if a workflow with one step and no dependencies
# starts, the fault is in `ci.yml` and `security.yml`; if it does not, the fault
# is above this repository and nothing written here will fix it.
#
# Delete this file once the answer is in the register.

name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "a step ran"
