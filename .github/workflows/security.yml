# The scan that makes ADR-025's promise checkable.
#
# ADR-025 commits in writing to fixing reported vulnerabilities within ninety
# days. Until CI existed nothing reported one at all; ci.yml now fails a build on
# a vulnerable package, and that closed half the gap. **The other half is that a
# vulnerability is disclosed on somebody else's schedule, not on ours.** A
# dependency clean at the moment of the last push is not a dependency clean
# today, and a project whose last commit was six weeks ago would learn about a
# CVE from a user.
#
# So this runs nightly against the default branch, whether or not anybody pushed.
# The ninety days start when the advisory is published, and the point of a
# nightly scan is that the clock and the notification start together.
#
# **CodeQL is the other half of the same argument, in the other direction.**
# `dotnet list package --vulnerable` finds problems other people have already
# found and published. CodeQL looks at code nobody has reviewed but us — and
# CLAUDE.md is explicit that four of the nine §66 review gates are open
# precisely because they need a reader who did not write the thing. A static
# analyser is not that reader, and this file does not pretend otherwise. It is
# the part of the job a machine can do while the rest waits for a person.

name: security

on:
  schedule:
    # 03:17 UTC. An odd minute on purpose: the hour and the half-hour are when
    # every scheduled job on the platform runs at once, and GitHub drops or
    # delays what it cannot fit.
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: restore
        run: dotnet restore graticula.sln

      # <b>The exit code is derived from the output, not trusted.</b>
      # `dotnet list package --vulnerable` prints its findings and exits zero
      # whatever it finds, so a job that only checked the exit code would be
      # green on the day it mattered.
      - name: vulnerable packages
        run: |
          dotnet list graticula.sln package --vulnerable --include-transitive \
            > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -qE '^\s+>' vulnerable.txt; then
            echo "::error::A dependency has a reported vulnerability. ADR-025 commits to fixing these within ninety days, and the ninety days started when the advisory was published rather than when this job ran."
            exit 1
          fi

      # Not a failure. A deprecated package is a maintenance signal on somebody
      # else's timetable, and failing the nightly on it would train everybody to
      # ignore the nightly.
      - name: deprecated packages
        run: dotnet list graticula.sln package --deprecated

      # <b>DEPENDENCY-LICENSES.md is a promise too.</b> Apache-2.0 outbound
      # disqualifies GPL and AGPL, and a transitive dependency can introduce one
      # without anybody choosing it. This lists what is actually resolved so the
      # register can be checked against reality rather than against memory.
      - name: what is actually referenced
        run: |
          dotnet list graticula.sln package --include-transitive \
            > packages.txt 2>&1
          echo "### Resolved packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -200 packages.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: codeql
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # security-and-quality over the default: the default set is tuned for
          # a codebase where noise costs more than a missed finding, and this one
          # has 67 live ADR conditions and four unrun review gates. A false
          # positive here costs an afternoon; a missed one ships.
          queries: security-and-quality

      # <b>Built by hand rather than by autobuild.</b> Directory.Build.props sets
      # TreatWarningsAsErrors, and autobuild's own build flags have defeated that
      # before in other projects — a scan of a build that did not enforce the
      # repository's own rules is a scan of something else.
      - name: build
        run: dotnet build graticula.sln -c Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
