<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graticula — ArcGIS Maps SDK</title>

<!--
  The ArcGIS Maps SDK for JavaScript, pointed at this server.

  Loaded from Esri's CDN, which is not redistribution: the browser fetches it,
  and nothing proprietary is shipped inside this product.

  Its value is that it is the real thing. A lightweight client asks for very
  little; the Maps SDK is what ArcGIS Pro and every Esri web app are built on,
  and it asks for everything. Pointing it here is the closest test available of
  whether this server is genuinely ArcGIS-compatible rather than compatible with
  the subset we happened to implement.

  Two things this comment used to say and no longer should. It claimed the
  console uses esri-leaflet — ADR-020 §4 was amended on 2026-08-14 and the
  console uses this same SDK. And it claimed an OpenStreetMap basemap: §4a
  removed that on 2026-08-16, because their usage policy does not permit being an
  application's basemap and every tile came back 403. There is no basemap unless
  one is configured, and the console's map panel is where that happens.

  The behaviour is in map.js, not inline here. The console's policy is
  `script-src 'self' https://js.arcgis.com` with no `'unsafe-inline'`, so an
  inline block on this page is blocked — which is what happened for one edit
  after D-44 was closed, and it renders as a page with a header and nothing else.
-->

<!--
  Where the map SDK lives, generated by the server from `Graticula:MapSdkUrl` — the same value
  its Content-Security-Policy is built from. ADR-034 condition 3: this page used to carry the
  address twice, as a blocking script and a stylesheet, while the policy carried a third copy,
  so an operator moving the SDK would have changed one of the three and got a blocked script
  with nothing in the server's log. map.js loads the library from this value and waits for it.
-->
<script src="surface.js"></script>

<style>
  html, body { margin: 0; height: 100%; font: 15px/1.5 system-ui, sans-serif; }
  #frame { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { padding: 11px 18px; background: #f5f8f6; border-bottom: 1px solid #d7e0dc; color: #0f1e1b; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: #576a66; }
  header code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  #view { width: 100%; height: 100%; }
  #facts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 6px;
           font-size: 12.5px; color: #576a66; }
  #facts:empty { display: none; }
  #facts code { font-size: 11.5px; }
  #facts button { font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer;
                  border: 1px solid #0b6157; border-radius: 3px; background: #0b6157;
                  color: #fff; }
  #picker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #picker:empty { display: none; }
  #picker button { font: inherit; font-size: 12.5px; padding: 3px 9px; cursor: pointer;
                   border: 1px solid #d7e0dc; border-radius: 3px; background: #fff;
                   color: #0f1e1b; }
  #picker button:hover { border-color: #0b6157; color: #0b6157; }
  #picker button.on { background: #0b6157; border-color: #0b6157; color: #fff; }
  #note {
    position: absolute; z-index: 50; left: 50%; transform: translateX(-50%); top: 74px;
    background: #fff; border: 1px solid #d7e0dc; border-left: 3px solid #a63a2b;
    border-radius: 3px; padding: 12px 16px; max-width: 560px; font-size: 13.5px;
    box-shadow: 0 10px 28px -14px rgba(0,0,0,.4); display: none;
  }
  #note.on { display: block; }
  #note b { display: block; margin-bottom: 4px; }

  /*
    <b>A focus ring, because there was none anywhere on this page.</b> [D-140](../../../docs/architecture-debt.md).
    The *Frame layer* button and the attribution link showed the browser's own ring; the map
    surface and the SDK's zoom widget did not, because the Calcite theme this page loads sets
    `outline: none` on them. A keyboard reader could tab into the map and have no idea they
    were there — and the gap looked like a rendering fault rather than a missing style, which
    is why it survived a review that checked everything else.

    <b>Declared here rather than fought for in the SDK's own stylesheet.</b> The theme arrives
    from a CDN and its selectors are its own; a rule of ours on the elements it renders is the
    part we control, and `:focus-visible` means a mouse click does not draw one.
  */
  :focus-visible,
  #view:focus-visible,
  .esri-widget--button:focus-visible,
  .esri-view-surface:focus-visible,
  .esri-view-surface--inset-outline:focus-visible {
    outline: 2px solid #0b6157 !important;
    outline-offset: 2px;
  }

  /*
    <b>The note is announced, not just displayed.</b> It is the only thing on the page that
    says *the layer would not draw* — including the deliberate refusal for a private service,
    which is carefully worded and which a screen-reader user never heard. `role="status"` with
    `aria-live="polite"` reads it out when it appears, and *polite* rather than *assertive*
    because it is an explanation rather than an interruption.

    The attributes are on the element in the markup; this rule only exists to say why.
  */
</style>
</head>
<body>
<div id="frame">
  <header>
    <h1>Graticula — read by the ArcGIS Maps SDK for JavaScript</h1>
    <p>Layer <code id="which"></code>. <span id="ground"></span></p>
    <!--
      What is drawn and where, with a way back to it.

      A handful of small polygons at country zoom is sub-pixel, so "nothing is
      visible" and "nothing is there" look identical — the same confusion that
      removing the basemap caused, one level down. Saying the count and the extent
      answers it without anybody having to guess, and Frame puts the view back on
      the data after panning away.
    -->
    <div id="facts"></div>
    <div id="picker"></div>
  </header>
  <div id="view"></div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<!-- First, so it is listening before anything else can throw. ADR-045. -->
<script src="report.js"></script>
<script src="ground.js" defer></script>
<script src="map.js" defer></script>
</body>
</html>
