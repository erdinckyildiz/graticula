<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graticula — layer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!--
  The layer viewer, on OpenLayers.

  <b>Owner decision, 2026-08-16, asked for twice.</b> ADR-020 §4 chose Esri's Maps
  SDK from Esri's CDN, and its argument was real: the most demanding Esri client
  pointed at our own service is the closest available test of ArcGIS compatibility.
  That argument is about *testing*, and it kept being used to justify the thing an
  operator looks at every day.

  OpenLayers is BSD-2-Clause, so it is vendored here — 858 KB, committed, pinned to
  10.3.1. Nothing reaches a CDN at runtime, which means: the console's
  Content-Security-Policy needs no third-party origin, an air-gapped deployment
  (Q-15) works, and no third party learns that this server exists. GeoServer ships
  an OpenLayers preview for the same reasons.

  <b>It reads our FeatureServer directly.</b> OpenLayers has an `EsriJSON` format,
  so no server change was needed — `f=geojson` is accepted and ignored by this
  server, and it did not have to stop being.

  The Esri SDK page survives at map.html as what it always argued for: a
  compatibility probe. Both are offered from the services directory, so the two
  jobs are visible as two jobs.
-->

<!-- The remembered theme, set before the first paint exactly as the console sets it (ADR-187 step 4). -->
<script src="session.js"></script>
<link rel="stylesheet" href="ol.css">
<script src="ol.js"></script>

<style>
  /* TOKENS-FROM: console.css. Every --name here that console.css also declares is a copy of its :root (light) and
     :root[data-theme="dark"] value, made by hand because these pages are outside the console's stylesheet; the rest
     (--veil, --map-bg, --float, --ol-*) are the map pages' own. The copies are
     webmap.html, view.html and map.html; this line, the same in each, is what a test finds them by. */
  :root {
    --paper: #f4f6f9; --surface: #ffffff; --surface-2: #f1f4f8; --ink: #101826; --muted: #566275; --faint: #616b7a;
    --rule: #e3e8ef; --rule-strong: #cfd7e3;
    --accent: #1565d8; --accent-soft: #e8f0fe; --accent-ink: #1257c2; --accent-line: #bcd2fa; --on-accent: #ffffff;
    --alert: #a5342a; --alert-soft: #fceceb; --alert-line: #edc4c0;
    --veil: rgba(255, 255, 255, .94);
    --lift: 0 1px 2px rgba(16, 24, 38, .05); --float: 0 8px 24px -12px rgba(16, 24, 38, .35);
    --round: 5px; --round-lg: 8px;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ol-background-color: var(--surface); --ol-accent-background-color: var(--surface-2);
    --ol-partial-background-color: var(--veil); --ol-foreground-color: var(--ink);
    --ol-subtle-foreground-color: var(--muted); --ol-subtle-background-color: transparent;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0a1120; --surface: #0f1828; --surface-2: #142034; --ink: #e6ebf4; --muted: #9aa7bd; --faint: #8592aa;
    --rule: #1f2b40; --rule-strong: #2b3a55;
    --accent: #2563eb; --accent-soft: #11264a; --accent-ink: #6aa6ff; --accent-line: #24497f;
    --alert: #f58a7f; --alert-soft: #3a1714; --alert-line: #6a2a24;
    --veil: rgba(15, 24, 40, .94);
    --lift: 0 1px 2px rgba(0, 0, 0, .4); --float: 0 8px 24px -10px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  /* As the console has it: an element given `hidden` stays hidden whatever display its own rule gives it. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font: 15px/1.5 var(--sans); color: var(--ink); background: var(--paper); }
  a { color: var(--accent-ink); }
  #frame { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }
  /*
    <b>A header that wraps, and it was one fixed row of 54 pixels.</b> Handoff 2026-09-04 put the
    facts beside the name to keep chrome off the map, and fixed the height because the card and the
    explanation were placed by an offset from the top of the window. They are placed inside the map
    now (`#mapWrap`), so the header may take a second row — and at 390 pixels it has to: the facts,
    Frame layer and the way back were cut off by `overflow: hidden` (UX sweep M4, 2026-10-19).
  */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 54px; padding: 8px 16px;
           background: var(--surface); border-bottom: 1px solid var(--rule); color: var(--ink); min-width: 0; }
  .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
  /* The way back to the service in the directory, on every width. */
  #back { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; color: var(--ink);
          border: 1px solid var(--rule-strong); border-radius: var(--round); }
  #back:hover { border-color: var(--accent); color: var(--accent-ink); }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; min-width: 0;
              overflow-wrap: anywhere; line-height: 1.25; }

  /* <b>The facts wrap rather than clip.</b> Clipped, they cut "service document" to "service dc" at 1,280 (UX sweep
     m9); a fact can wait for a second line where a control could not wait off the edge. */
  #facts { display: flex; gap: 4px 14px; flex-wrap: wrap; align-items: center;
           font-size: 13px; color: var(--muted); min-width: 0; flex: 1 1 320px; }
  #facts > span { white-space: nowrap; }
  #facts button, #facts a { white-space: nowrap; flex: none; }
  #facts code { font-family: var(--mono); font-size: 12px; }
  #facts b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #directory { flex: none; font-size: 13px; color: var(--ink); text-decoration: none; display: inline-flex;
               align-items: center; min-height: 34px; padding: 0 12px; border: 1px solid var(--rule-strong);
               border-radius: var(--round); white-space: nowrap; background: var(--surface); }
  #directory:hover { border-color: var(--accent); color: var(--accent-ink); }
  button { font: inherit; font-size: 13px; min-height: 30px; padding: 3px 10px; cursor: pointer;
           border: 1px solid var(--rule-strong); border-radius: var(--round); background: var(--surface);
           color: var(--ink); }
  button:hover { border-color: var(--accent); color: var(--accent-ink); }
  /* A chosen layer or ground is a selection: the accent's soft fill, not the solid one an action would carry. */
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  /* The two faces, as one control rather than two buttons: they are alternatives. */
  #faces { display: inline-flex; flex: none; gap: 2px; padding: 3px; border-radius: 7px;
           background: var(--surface-2); border: 1px solid var(--rule); }
  #faces a { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: var(--round);
             font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
  #faces a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--lift);
                           outline: 1px solid var(--rule-strong); }

  #picker { display: flex; gap: 6px; flex-wrap: nowrap; flex: 0 1 auto; min-width: 0;
            overflow-x: auto; scrollbar-width: none; }
  #picker::-webkit-scrollbar { height: 0; }
  #picker button { flex: none; }
  #picker:empty { display: none; }

  /* The map and everything placed on it; OpenLayers owns `#map`, so the controls are its siblings in here. */
  #mapWrap { position: relative; min-height: 0; min-width: 0; }
  #map { position: absolute; inset: 0; background: #bfd6e2; }
  #map:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /*
    <b>The grounds are on the map, not above it.</b> They change what is drawn under the data,
    so they belong where the reader is looking when they want one — and in the header they were
    a fourth row of chrome for a control most people press once.
  */
  #grounds { position: absolute; z-index: 40; left: 64px; top: 12px;
             display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
             padding: 6px 8px; border-radius: var(--round); background: var(--veil);
             border: 1px solid var(--rule-strong); box-shadow: var(--lift);
             font-size: 12.5px; color: var(--muted); max-width: calc(100% - 400px); }
  #grounds:empty { display: none; }
  #grounds > span:first-child { text-transform: uppercase; letter-spacing: .05em; font-weight: 650; padding: 0 2px; }

  /* On a phone the grounds and the legend open on demand from these two buttons (UX sweep M4). */
  #onmap { display: none; }

  /* The strip: scale, which face drew this, and where. */
  #strip { position: absolute; z-index: 40; left: 12px; right: 12px; bottom: 12px;
           display: flex; align-items: center; gap: 14px;
           padding: 6px 12px; border-radius: var(--round);
           background: var(--veil); border: 1px solid var(--rule-strong);
           font-size: 12.5px; color: var(--ink); }
  #stripMode { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #stripWhere { font-family: var(--mono); white-space: nowrap; color: var(--muted);
                flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* <b>The other half of *where am I*.</b> A pair of coordinates without a zoom says which
     patch of the world and not how much of it, and the two are read as one figure. */
  #stripZoom { font-family: var(--mono); white-space: nowrap; color: var(--muted); }
  #stripScale { flex: none; }
  /* A finger leaves no pointer to report (UX sweep m4). */
  @media (hover: none) { #stripWhere { display: none; } }

  /*
    Bottom right, above the strip, and it collapses when it has nothing to say — an empty box in
    the corner of a map reads as a panel that failed to load.
  */
  #legend { position: absolute; z-index: 40; right: 12px; bottom: 92px; max-width: 280px;
            max-height: 46%; overflow: auto;
            padding: 10px 12px; border-radius: var(--round-lg);
            background: var(--surface); border: 1px solid var(--rule-strong); box-shadow: var(--float);
            font-size: 13px; color: var(--ink); }
  #legend:empty { display: none; }
  /* Not in capitals: a legend's heading is a layer's name, and names are data (round 2, N5: tr_il read TR_IL). */
  #legend b { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); margin-bottom: 5px; }
  #legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  #legend img { width: 16px; height: 16px; flex: none; }
  #legend .swatch { width: 14px; height: 14px; flex: none; border-radius: 2px;
                    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
  /* The legend's explanation is read, so it is body text in --muted: --faint #7d8f8b was 3.4:1 (UX sweep M3). */
  #legend .said { display: block; margin-top: 6px; color: var(--muted); line-height: 1.45; }

  /* Inside the strip the two controls are content, so they give up their own corners. */
  #strip .ol-scale-line, #strip .ol-mouse-position {
    position: static; background: none; padding: 0; margin: 0; }
  #strip .ol-scale-line-inner { margin: 0; color: var(--ink); border-color: var(--ink); font-size: 11px; }

  /* The map's own buttons, 40 px at every width (UX sweep M2: they were 21 by 21, the attribution 15 by 15). */
  .ol-zoom { top: 12px; left: 12px; padding: 0; background: var(--surface); border: 1px solid var(--rule-strong);
             border-radius: var(--round); box-shadow: var(--lift); overflow: hidden; }
  .ol-zoom button { width: 40px; height: 40px; margin: 0; font-size: 22px; font-weight: 400; line-height: 1;
                    border-radius: 0; background: var(--surface); color: var(--ink); border: 0; min-height: 0; }
  .ol-zoom button + button { border-top: 1px solid var(--rule); }
  .ol-zoom button:hover, .ol-zoom button:focus { background: var(--surface-2); color: var(--ink); outline: 0; }
  .ol-zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ol-control button { min-width: 28px; min-height: 28px; }
  .ol-attribution { font-size: 11px; bottom: 56px; background: var(--veil); color: var(--muted); }
  .ol-attribution a { color: var(--accent-ink); }

  /*
    <b>A not-found or not-shared service, said in the server's words with the two ways on</b> — UX sweep M6. It said
    "Nothing to draw. This service lists no feature layers." for a service that does not exist, which named the wrong
    cause and offered no next step, under a one-sided red bar.
  */
  #note { position: absolute; z-index: 50; left: 50%; transform: translateX(-50%); top: 12px;
          width: min(560px, calc(100% - 24px)); display: none; gap: 10px;
          background: var(--surface); border: 1px solid var(--alert-line); border-radius: var(--round-lg);
          padding: 12px 14px; font-size: 14px; box-shadow: var(--float); }
  #note.on { display: flex; }
  #note > svg { color: var(--alert); margin-top: 2px; }
  #note .body { min-width: 0; overflow-wrap: anywhere; }
  #note b { display: block; margin-bottom: 3px; }
  #note .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #note .acts a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; text-decoration: none;
                  border: 1px solid var(--rule-strong); border-radius: var(--round); color: var(--ink); }
  #note .acts a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  #attrs { position: absolute; z-index: 40; right: 12px; top: 12px; width: 300px; max-width: calc(100% - 24px);
           max-height: 60%; overflow: auto; background: var(--surface);
           border: 1px solid var(--rule-strong); border-radius: var(--round-lg); font-size: 13px;
           display: none; box-shadow: var(--float); }
  #attrs.on { display: block; }
  #attrs table { border-collapse: collapse; width: 100%; }
  #attrs th, #attrs td { text-align: left; padding: 5px 10px; border-top: 1px solid var(--rule);
                         vertical-align: top; }
  #attrs th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  #attrs td { font-variant-numeric: tabular-nums; word-break: break-word; }
  #attrs tr:first-child th, #attrs tr:first-child td { border-top: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /*
    <b>A focus ring, because there was none anywhere on this page.</b> [D-140](../../../docs/architecture-debt.md).
    The *Frame layer* button and the attribution link showed the browser's own ring; the map
    surface did not. Since 2026-10-19 the map takes focus (UX sweep M7), so it has one too.
  */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /*
    <b>The note is announced, not just displayed.</b> It is the only thing on the page that
    says *the layer would not draw* — including the deliberate refusal for a private service,
    which is carefully worded and which a screen-reader user never heard. `role="status"` with
    `aria-live="polite"` reads it out when it appears, and *polite* rather than *assertive*
    because it is an explanation rather than an interruption.

    The attributes are on the element in the markup; this rule only exists to say why.
  */

  /* A phone: the header takes the rows it needs; the grounds and the legend wait behind two buttons on the map. */
  /*
    <b>Two rows on a phone, and it was four</b> (UX sweep round 2, M4: 209 to 233 of 844 pixels): the way back, the name
    and the layer document on the first; the faces, Frame layer and any layers to choose on the second. The facts are
    read in the layer document there. `display: contents` lets the two controls inside the facts take their own places.
  */
  @media (max-width: 760px) {
    header { padding: 8px 12px; gap: 8px 10px; }
    .title { flex: 1 1 160px; order: 0; }
    header h1 { font-size: 15px; }
    #back { width: 40px; height: 40px; }
    #facts { display: contents; }
    #facts > span { display: none; }
    #facts > a { order: 1; flex: none; font-size: 13px; }
    #faces { order: 2; }
    #facts > button { order: 3; }
    #picker { order: 4; flex: 1 1 0; }
    /* One layer is nothing to choose between, and was a row of its own. */
    #picker:has(> button:only-child) { display: none; }
    #directory { display: none; }
    #onmap { display: flex; position: absolute; z-index: 41; top: 12px; right: 12px; flex-direction: column;
             align-items: flex-end; gap: 8px; }
    #onmap button { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--lift); }
    #grounds, #legend { display: none; }
    #grounds.open, #legend.open { display: flex; }
    #legend.open { display: block; }
    #grounds { left: 12px; right: 12px; top: 112px; max-width: none; }
    #legend { left: 12px; right: 12px; max-width: none; }
    /* The card sits at the foot of the map, where the Ground panel at the head cannot cover it (round 2, N3). */
    #attrs { top: auto; bottom: 56px; left: 12px; right: 12px; width: auto; max-height: 45%; }
    button, #faces a { min-height: 40px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
</svg>
<div id="frame">
  <header>
    <div class="title">
      <!-- The way back to the service's own page in the directory; view.js points it there. -->
      <a id="back" href="/rest/services" aria-label="Back to the services directory"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <h1 id="title">layer</h1>
    </div>
    <div id="facts"></div>
    <!--
      <b>The 1c handoff's face switch, and it makes a feature reachable rather than adding one.</b>
      Both faces have been here since 2026-08-21 and the only way to reach the second was to type
      `&face=mapserver` into the address bar — a capability with no control, which is ADR-034's
      rule read backwards. Having both against one layer is what this page is for: correctness
      gate 2 found four disagreements between them by hand, and a click is how anybody else
      repeats that.

      <b>Two, not the prototype's three.</b> It draws Features, Tiles and Map image; this server's
      viewer has a feature face and a map-image face, and no tile face at all. A third segment
      would be a control for something that does not exist, which is the rule the paragraph above
      is quoting.
    -->
    <nav id="faces" aria-label="Which face draws this"></nav>
    <div id="picker"></div>
    <a id="directory" href="/rest/services">Services directory</a>
  </header>
  <div id="mapWrap">
    <!-- Focusable, as Map Viewer's map is: the arrows pan, + and - zoom, Enter reads what is at the centre (UX sweep M7). -->
    <div id="map" tabindex="0" aria-label="Map. Arrow keys pan, plus and minus zoom, Enter shows the attributes of the feature at the centre."></div>
    <!--
      The grounds this server can draw under the data — its own tile services.
      This was a `?ground=` query parameter, which is the same as not existing:
      the answer to "can we use OpenStreetMap data" is *import it and serve your
      own tiles*, and it has to be visible for that to be an answer.

      <b>A sibling of the map, not a child of it.</b> OpenLayers owns everything inside its
      target element; a control placed in there is a control the next redraw may remove. The
      attribute card and the explanation below are outside for the same reason and always were.
    -->
    <div id="onmap">
      <button type="button" id="groundsOpen" aria-expanded="false" aria-controls="grounds"><svg class="i" aria-hidden="true"><use href="#i-layers"/></svg>Ground</button>
      <button type="button" id="legendOpen" aria-expanded="false" aria-controls="legend"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg>Legend</button>
    </div>
    <div id="grounds"></div>
    <!--
      <b>The 1c handoff's legend, and what it may say depends on who drew the picture.</b> On the map
      image face the server draws from the layer's stored symbology and answers
      `MapServer/legend` with a swatch per class — so the legend is the server's own account of what
      it painted, which is the rule ADR-051 states: a picture's explanation must come from whatever
      made the picture. On the feature face this browser draws, in one colour chosen in this file and
      not the layer's, and the legend says exactly that rather than borrowing the server's classes to
      describe pixels the server did not produce.
    -->
    <!-- Focusable, because a long legend scrolls and a keyboard has to be able to scroll it (round 2, N4). -->
    <div id="legend" tabindex="0" role="region" aria-label="Legend"></div>
    <!--
      <b>The 1c handoff's status strip: the scale bar, what is drawing, and where the pointer is.</b>
      The OpenLayers controls render into it rather than being reimplemented: a control takes a
      `target`, so `ScaleLine` and `MousePosition` stay OpenLayers'.
    -->
    <div id="strip">
      <span id="stripScale"></span>
      <span id="stripMode"></span>
      <span id="stripWhere"></span>
      <span id="stripZoom"></span>
    </div>
    <div id="note" role="status" aria-live="polite"></div>
    <div id="attrs" role="region" aria-label="Attributes"></div>
    <!-- What Enter on the map found, or did not: said for the keyboard reader the card alone would not tell. -->
    <span class="sr" id="said" role="status" aria-live="polite"></span>
  </div>
</div>

<!--
  ground.js for one constant: which tiles are the ground. It builds ArcGIS layers,
  which this page does not use, but the *decision* is shared and the construction
  is not — that split is the fix for four rounds of "Natural Earth is still
  showing". Loaded before view.js so the constant exists when it reads it.
-->
<!-- First, so it is listening before anything else can throw. ADR-045. -->
<script src="report.js"></script>
<script src="ground.js" defer></script>
<script src="view.js" defer></script>
</body>
</html>
