<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graticula — layer</title>

<!--
  The layer viewer, on OpenLayers.

  <b>Owner decision, 2026-08-16, asked for twice.</b> ADR-020 §4 chose Esri's Maps
  SDK from Esri's CDN, and its argument was real: the most demanding Esri client
  pointed at our own service is the closest available test of ArcGIS compatibility.
  That argument is about *testing*, and it kept being used to justify the thing an
  operator looks at every day.

  OpenLayers is BSD-2-Clause, so it is vendored here — 858 KB, committed, pinned to
  10.3.1. Nothing reaches a CDN at runtime, which means: the console's
  Content-Security-Policy needs no third-party origin, an air-gapped deployment
  (Q-15) works, and no third party learns that this server exists. GeoServer ships
  an OpenLayers preview for the same reasons.

  <b>It reads our FeatureServer directly.</b> OpenLayers has an `EsriJSON` format,
  so no server change was needed — `f=geojson` is accepted and ignored by this
  server, and it did not have to stop being.

  The Esri SDK page survives at map.html as what it always argued for: a
  compatibility probe. Both are offered from the services directory, so the two
  jobs are visible as two jobs.
-->

<link rel="stylesheet" href="ol.css">
<script src="ol.js"></script>

<style>
  :root {
    --paper: #f5f8f6; --surface: #fff; --ink: #0f1e1b; --muted: #576a66;
    --faint: #7d8f8b; --rule: #d7e0dc; --accent: #0b6157; --water: #dce7ec;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  #frame { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  /*
    <b>One row, and it was four.</b> Handoff 2026-09-04. The header stacked a title, a line of
    facts, a picker and the ground chips, which came to about 110 pixels of chrome over a map —
    on the one page whose whole subject is the map. The facts sit beside the name now, the
    picker and the way out sit at the right, and the grounds move onto the picture where the
    thing they change is.

    <b>A fixed height, because two things are positioned under it.</b> The attribute card and
    the explanation are placed by an offset from the top of the window; with a header that grew
    a line whenever a layer had a long name, that offset was a guess. 54 is the console's own
    top bar less its four pixels of padding.
  */
  header { display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 16px;
           overflow: hidden;
           background: var(--surface); border-bottom: 1px solid var(--rule);
           color: var(--ink); flex: none; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
              white-space: nowrap; }
  header h1 a { color: var(--accent); text-decoration: none; font-weight: 400; font-size: 13px; }

  /* The mark, two letters and a gradient — the console's own, so the viewer reads as part of
     the same product rather than as a page that happens to draw a map. */
  .mark { width: 24px; height: 24px; flex: none; border-radius: 6px; display: grid;
          place-items: center; color: #fff; font: 700 11px/1 system-ui, sans-serif;
          background: linear-gradient(148deg, #57bda9, #0b6157 60%, #08463f); }

  /* <b>The facts give up the width, and the two controls beside them do not.</b> Measured at
     1280 on a three-layer service: the row wanted more than the window, and what broke was
     *Frame layer* and *Services directory* — a verb wrapped in half and a link off the right
     edge. A fact can be clipped and read from the layer document; a control cannot. */
  #facts { display: flex; gap: 14px; flex-wrap: nowrap; align-items: center;
           font-size: 12.5px; color: var(--muted); min-width: 0; overflow: hidden;
           /* <b>Basis nought, so this takes what is left rather than what it wants.</b> With
              `auto` the facts asked for their full width and every flex child then shrank in
              proportion — which still overflowed, because a button and a link inside them do
              not shrink. Nought means the controls are measured first and the facts fill the
              gap, which is the order they should be read in anyway. */
           flex: 1 1 0; }
  #facts > span { white-space: nowrap; }
  #facts button, #facts a { white-space: nowrap; flex: none; }
  #facts code { font-family: var(--mono); font-size: 11.5px; }
  #facts b { color: var(--ink); }
  #directory { margin-left: auto; flex: none; font-size: 12.5px; color: var(--accent);
               text-decoration: none; padding: 5px 12px; border: 1px solid var(--rule);
               border-radius: 3px; white-space: nowrap; }
  #directory:hover { border-color: var(--accent); }
  button { font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer;
           border: 1px solid var(--rule); border-radius: 3px; background: var(--surface);
           color: var(--ink); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* The two faces, as one control rather than two buttons: they are alternatives. */
  #faces { display: inline-flex; flex: none; gap: 2px; padding: 2px; border-radius: 5px;
           background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule); }
  #faces a { padding: 4px 11px; border-radius: 4px; font-size: 12.5px; font-weight: 500;
             color: var(--muted); text-decoration: none; white-space: nowrap; }
  #faces a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 600;
                           box-shadow: 0 1px 2px rgba(16, 24, 38, .12); }

  #picker { display: flex; gap: 6px; flex-wrap: nowrap; flex: 0 1 auto; min-width: 0;
            margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  #picker::-webkit-scrollbar { height: 0; }
  #picker button { flex: none; }
  #picker:empty { display: none; }
  #picker + #directory { margin-left: 0; }

  /*
    <b>The grounds are on the map, not above it.</b> They change what is drawn under the data,
    so they belong where the reader is looking when they want one — and in the header they were
    a fourth row of chrome for a control most people press once.
  */
  #grounds { position: absolute; z-index: 40; left: 12px; top: 66px;
             display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
             padding: 6px 8px; border-radius: 6px; background: rgba(255, 255, 255, .94);
             box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--rule);
             font-size: 12px; color: var(--faint); max-width: calc(100% - 340px); }
  #grounds:empty { display: none; }
  #grounds > span:first-child { text-transform: uppercase; letter-spacing: .04em;
                               font-weight: 600; padding: 0 2px; }
  #map { width: 100%; height: 100%; background: #bfd6e2; }

  /*
    Both of these are positioned explicitly, and that is a fix rather than a
    preference. Overriding OpenLayers' scale line with a background but no
    `position` left it as a full-width white band across the middle of the map —
    which is what it looked like: a mysterious white line. A control has to be
    told where it lives.
  */
  /*
    The strip the handoff asks for. It spans the bottom because the three things on it are
    read together — a distance, a source and a position are one sentence about the picture
    above them — and a bar is the shape that says so.
  */
  #strip { position: absolute; z-index: 40; left: 12px; right: 12px; bottom: 12px;
           display: flex; align-items: center; gap: 14px;
           padding: 6px 12px; border-radius: 4px;
           background: rgba(255, 255, 255, .92); box-shadow: 0 0 0 1px var(--rule);
           font-size: 11.5px; color: var(--muted); }
  #stripMode { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  #stripWhere { font-family: var(--mono); white-space: nowrap; }
  /* <b>The other half of *where am I*.</b> A pair of coordinates without a zoom says which
     patch of the world and not how much of it, and the two are read as one figure. */
  #stripZoom { font-family: var(--mono); white-space: nowrap; color: var(--faint); }
  #stripScale { flex: none; }

  /*
    Bottom right, above the strip, and it collapses when it has nothing to say — an empty box in
    the corner of a map reads as a panel that failed to load.
  */
  #legend { position: absolute; z-index: 40; right: 12px; bottom: 52px; max-width: 260px;
            max-height: 46%; overflow: auto;
            padding: 9px 11px; border-radius: 4px;
            background: rgba(255, 255, 255, .93); box-shadow: 0 0 0 1px var(--rule);
            font-size: 11.5px; color: var(--ink); }
  #legend:empty { display: none; }
  #legend b { display: block; font-size: 11px; text-transform: uppercase;
              letter-spacing: .04em; color: var(--faint); margin-bottom: 5px; }
  #legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  #legend img { width: 16px; height: 16px; flex: none; }
  #legend .swatch { width: 14px; height: 14px; flex: none; border-radius: 2px;
                    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
  #legend .said { display: block; margin-top: 6px; color: var(--faint); line-height: 1.45; }

  /* Inside the strip the two controls are content, so they give up their own corners. */
  #strip .ol-scale-line, #strip .ol-mouse-position {
    position: static; background: none; padding: 0; margin: 0; }
  #strip .ol-scale-line-inner { margin: 0; }

  .ol-scale-line { position: absolute; left: 10px; bottom: 10px; width: auto;
                   background: rgba(255,255,255,.82); padding: 2px 4px; border-radius: 3px; }
  .ol-scale-line-inner { color: var(--ink); border-color: var(--muted); font-size: 11px;
                         margin: 0; }
  .ol-mouse-position { position: absolute; top: auto; bottom: 10px; right: 10px;
                       background: rgba(255,255,255,.82); padding: 2px 7px; border-radius: 3px;
                       font-family: var(--mono); font-size: 11px; color: var(--muted); }
  #note { position: absolute; z-index: 50; left: 50%; transform: translateX(-50%); top: 66px;
          background: var(--surface); border: 1px solid var(--rule);
          border-left: 3px solid #a63a2b; border-radius: 3px; padding: 11px 15px;
          max-width: 560px; font-size: 13.5px; display: none;
          box-shadow: 0 10px 28px -14px rgba(0,0,0,.4); }
  #note.on { display: block; }
  #note b { display: block; margin-bottom: 3px; }
  #attrs { position: absolute; z-index: 40; right: 12px; top: 66px; width: 300px;
           max-height: 60%; overflow: auto; background: var(--surface);
           border: 1px solid var(--rule); border-radius: 3px; font-size: 12.5px;
           display: none; box-shadow: 0 10px 28px -18px rgba(0,0,0,.4); }
  #attrs.on { display: block; }
  #attrs table { border-collapse: collapse; width: 100%; }
  #attrs th, #attrs td { text-align: left; padding: 5px 10px; border-top: 1px solid var(--rule);
                         vertical-align: top; }
  #attrs th { color: var(--faint); font-weight: 600; white-space: nowrap; }
  #attrs td { font-family: var(--mono); font-size: 11.5px; word-break: break-word; }
  #attrs tr:first-child th, #attrs tr:first-child td { border-top: 0; }
  .ol-attribution { font-size: 11px; }

  /*
    <b>A focus ring, because there was none anywhere on this page.</b> [D-140](../../../docs/architecture-debt.md).
    The *Frame layer* button and the attribution link showed the browser's own ring; the map
    surface and the SDK's zoom widget did not, because the Calcite theme this page loads sets
    `outline: none` on them. A keyboard reader could tab into the map and have no idea they
    were there — and the gap looked like a rendering fault rather than a missing style, which
    is why it survived a review that checked everything else.

    <b>Declared here rather than fought for in the SDK's own stylesheet.</b> The theme arrives
    from a CDN and its selectors are its own; a rule of ours on the elements it renders is the
    part we control, and `:focus-visible` means a mouse click does not draw one.
  */
  :focus-visible,
  #view:focus-visible,
  .esri-widget--button:focus-visible,
  .esri-view-surface:focus-visible,
  .esri-view-surface--inset-outline:focus-visible {
    outline: 2px solid #0b6157 !important;
    outline-offset: 2px;
  }

  /*
    <b>The note is announced, not just displayed.</b> It is the only thing on the page that
    says *the layer would not draw* — including the deliberate refusal for a private service,
    which is carefully worded and which a screen-reader user never heard. `role="status"` with
    `aria-live="polite"` reads it out when it appears, and *polite* rather than *assertive*
    because it is an explanation rather than an interruption.

    The attributes are on the element in the markup; this rule only exists to say why.
  */
</style>
</head>
<body>
<div id="frame">
  <header>
    <span class="mark" aria-hidden="true">Gr</span>
    <h1 id="title">layer</h1>
    <div id="facts"></div>
    <!--
      <b>The 1c handoff's face switch, and it makes a feature reachable rather than adding one.</b>
      Both faces have been here since 2026-08-21 and the only way to reach the second was to type
      `&face=mapserver` into the address bar — a capability with no control, which is ADR-034's
      rule read backwards. Having both against one layer is what this page is for: correctness
      gate 2 found four disagreements between them by hand, and a click is how anybody else
      repeats that.

      <b>Two, not the prototype's three.</b> It draws Features, Tiles and Map image; this server's
      viewer has a feature face and a map-image face, and no tile face at all. A third segment
      would be a control for something that does not exist, which is the rule the paragraph above
      is quoting.
    -->
    <nav id="faces" aria-label="Which face draws this"></nav>
    <div id="picker"></div>
    <a id="directory" href="/rest/services">Services directory</a>
  </header>
  <div id="map"></div>
</div>
<!--
  The grounds this server can draw under the data — its own tile services.
  This was a `?ground=` query parameter, which is the same as not existing:
  the answer to "can we use OpenStreetMap data" is *import it and serve your
  own tiles*, and it has to be visible for that to be an answer.

  <b>A sibling of the frame, not a child of the map.</b> OpenLayers owns everything inside its
  target element; a control placed in there is a control the next redraw may remove. The
  attribute card and the explanation below are outside for the same reason and always were.
-->
<div id="grounds"></div>
<!--
  <b>The 1c handoff's status strip: the scale bar, what is drawing, and where the pointer is.</b>
  The scale bar sat bottom-left and the coordinates bottom-right, two controls the eye had to
  find separately, and neither said which of the two faces had produced the pixels between them —
  which is the one question this viewer exists to answer, because having both against one layer is
  the whole point of the page.

  <b>The OpenLayers controls move into it rather than being reimplemented.</b> A control takes a
  `target`, so `ScaleLine` and `MousePosition` render inside these spans and stay OpenLayers'
  — a hand-drawn scale bar is a second answer to *how far is that*, and the two would drift the
  first time a projection changed.
-->
<!--
  <b>The 1c handoff's legend, and what it may say depends on who drew the picture.</b> On the map
  image face the server draws from the layer's stored symbology and answers
  `MapServer/legend` with a swatch per class — so the legend is the server's own account of what
  it painted, which is the rule ADR-051 states: a picture's explanation must come from whatever
  made the picture. On the feature face this browser draws, in one colour chosen in this file and
  not the layer's, and the legend says exactly that rather than borrowing the server's classes to
  describe pixels the server did not produce.
-->
<div id="legend"></div>
<div id="strip">
  <span id="stripScale"></span>
  <span id="stripMode"></span>
  <span id="stripWhere"></span>
  <span id="stripZoom"></span>
</div>
<div id="note" role="status" aria-live="polite"></div>
<div id="attrs"></div>

<!--
  ground.js for one constant: which tiles are the ground. It builds ArcGIS layers,
  which this page does not use, but the *decision* is shared and the construction
  is not — that split is the fix for four rounds of "Natural Earth is still
  showing". Loaded before view.js so the constant exists when it reads it.
-->
<!-- First, so it is listening before anything else can throw. ADR-045. -->
<script src="report.js"></script>
<script src="ground.js" defer></script>
<script src="view.js" defer></script>
</body>
</html>
