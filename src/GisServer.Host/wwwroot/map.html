<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gis-server — ArcGIS Maps SDK</title>

<!--
  The ArcGIS Maps SDK for JavaScript, pointed at this server.

  Loaded from Esri's CDN, which is not redistribution: the browser fetches it,
  and nothing proprietary is shipped inside this product. That distinction is
  why this page can exist while ADR-020 §4 still keeps esri-leaflet — which is
  Apache-2.0 — in the console itself.

  Its value is that it is the real thing. esri-leaflet is a lightweight client
  that asks for very little; the Maps SDK is what ArcGIS Pro and every Esri web
  app are built on, and it asks for everything. Pointing it here is the closest
  test available of whether this server is genuinely ArcGIS-compatible rather
  than compatible with the subset we happened to implement.

  The basemap is OpenStreetMap rather than an Esri basemap, so no API key and no
  Esri account is needed to look at your own data.
-->

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.29/"></script>

<style>
  html, body { margin: 0; height: 100%; font: 15px/1.5 system-ui, sans-serif; }
  #frame { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { padding: 11px 18px; background: #f5f8f6; border-bottom: 1px solid #d7e0dc; color: #0f1e1b; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: #576a66; }
  header code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  #view { width: 100%; height: 100%; }
  #note {
    position: absolute; z-index: 50; left: 50%; transform: translateX(-50%); top: 74px;
    background: #fff; border: 1px solid #d7e0dc; border-left: 3px solid #a63a2b;
    border-radius: 3px; padding: 12px 16px; max-width: 560px; font-size: 13.5px;
    box-shadow: 0 10px 28px -14px rgba(0,0,0,.4); display: none;
  }
  #note.on { display: block; }
  #note b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="frame">
  <header>
    <h1>gis-server — read by the ArcGIS Maps SDK for JavaScript</h1>
    <p>Layer <code id="which"></code>. Basemap is OpenStreetMap, so no Esri account is involved.</p>
  </header>
  <div id="view"></div>
</div>
<div id="note"></div>

<script>
  // ?layer=name to look at a different one.
  const layerName = new URLSearchParams(location.search).get("layer") || "landmarks";
  const url = `${location.origin}/rest/services/${encodeURIComponent(layerName)}/FeatureServer/0`;
  document.getElementById("which").textContent = layerName;

  const note = document.getElementById("note");
  function problem(title, detail) {
    note.innerHTML = `<b>${title}</b>${detail}`;
    note.className = "on";
  }

  require([
    "esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer",
    "esri/layers/WebTileLayer", "esri/Basemap",
  ], (Map, MapView, FeatureLayer, WebTileLayer, Basemap) => {

    // OpenStreetMap rather than an Esri basemap. Esri's require an API key tied
    // to an ArcGIS account, which is precisely what the people this product is
    // for do not have.
    const basemap = new Basemap({
      baseLayers: [new WebTileLayer({
        urlTemplate: "https://tile.openstreetmap.org/{level}/{col}/{row}.png",
        copyright: "© OpenStreetMap contributors",
      })],
    });

    const features = new FeatureLayer({
      url,
      outFields: ["*"],
      popupTemplate: { title: "{name}", content: "{*}" },
    });

    const view = new MapView({
      container: "view",
      map: new Map({ basemap, layers: [features] }),
      center: [28.98, 41.015],
      zoom: 12,
    });

    // The SDK reports a failed layer load as a rejected promise rather than an
    // exception, and the message is the only place the actual cause appears —
    // usually an untrusted certificate, or a query parameter this server refused
    // with a reason worth reading.
    features.when(
      () => view.goTo(features.fullExtent ? features.fullExtent.expand(1.4) : view.extent),
      error => problem(
        "The SDK could not load the layer.",
        `${error.message || error}<br><br>If this mentions a network or certificate problem, open ` +
        `<a href="/healthz/live" target="_blank">/healthz/live</a>, accept the warning and reload. ` +
        `Otherwise it is a parameter this server refused — the message says which.`));
  });
</script>
</body>
</html>
