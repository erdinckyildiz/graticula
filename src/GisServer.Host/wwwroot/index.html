<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gis-server console</title>

<!--
  ADR-020 §2. This console may use no capability the admin API does not expose:
  it is static files and fetch, it holds the same session token any client would,
  and it is refused by the same privilege checks. Every action here is
  reproducible with curl, which is the test of whether the constraint held.

  No build step, no framework, no npm — A-055. The trade is a large file for a
  small supply chain, and it reverses at some size.

  The map is the ArcGIS Maps SDK, loaded from Esri's CDN. That is not
  redistribution — the browser fetches it and nothing proprietary ships inside
  this product — and it is the real client rather than a light one, which makes
  it the closest test of whether the server is genuinely ArcGIS-compatible.
-->

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.29/"></script>

<style>
  :root {
    --paper: #f5f8f6; --surface: #fff; --surface-2: #eff4f1;
    --ink: #0f1e1b; --muted: #576a66; --rule: #d7e0dc;
    --accent: #0b6157; --ok: #2f7a55; --stop: #92620d; --alert: #a63a2b;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 22px; border-bottom: 1px solid var(--rule); background: var(--surface); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .who { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em;
       color: var(--muted); font-weight: 600; margin: 26px 0 10px; }
  h2:first-child { margin-top: 0; }

  .panel { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em;
       text-transform: uppercase; color: var(--muted); font-weight: 400;
       padding: 10px 13px; background: var(--surface-2); border-bottom: 1px solid var(--rule); }
  td { padding: 9px 13px; border-top: 1px solid var(--rule); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
            margin-right: 7px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.25); }

  .pill { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
          letter-spacing: .05em; padding: 3px 7px; border-radius: 2px;
          border: 1px solid; display: inline-block; white-space: nowrap; }
  .p-started { color: var(--ok); border-color: var(--ok); }
  .p-stopped { color: var(--stop); border-color: var(--stop); }
  .p-public { color: var(--accent); border-color: var(--accent); }
  .p-organization, .p-private { color: var(--muted); border-color: var(--rule); }

  button, select { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 3px;
                   border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
                   cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 3px;
          border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }

  #mapPanel { display: none; margin-bottom: 8px; }
  #mapPanel.on { display: block; }
  #view { height: 480px; }
  #legend { padding: 9px 13px; border-top: 1px solid var(--rule); font-size: 13px;
            display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }

  #toast { position: fixed; right: 20px; bottom: 20px; max-width: 480px; z-index: 2000;
           background: var(--surface); border: 1px solid var(--rule); border-left-width: 3px;
           border-radius: 3px; padding: 12px 15px; font-size: 13.5px; display: none;
           box-shadow: 0 10px 28px -14px rgba(0,0,0,.5); }
  #toast.on { display: block; }
  #toast.bad { border-left-color: var(--alert); }
  #toast.good { border-left-color: var(--ok); }

  #signin { max-width: 380px; margin: 90px auto; }
  #signin .panel { padding: 22px; }
  #signin label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  #signin input, #signin button { width: 100%; }
  #signin button { margin-top: 18px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>gis-server</h1>
  <span class="sub" id="health">checking…</span>
  <span class="who" id="who"></span>
  <button id="signout" style="display:none">Sign out</button>
</header>

<div id="signin" class="wrap">
  <div class="panel">
    <b>Sign in</b>
    <label for="u">Name</label><input id="u" autocomplete="username">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
    <button class="primary" id="go">Sign in</button>
    <p class="hint">Everything below is the admin API. Nothing here can do anything
      <code>curl</code> could not.</p>
  </div>
</div>

<main class="wrap" id="app" style="display:none">
  <div class="panel" id="mapPanel">
    <div id="view"></div>
    <div id="legend"></div>
  </div>

  <h2>Services</h2>
  <div class="panel">
    <table>
      <thead><tr>
        <th></th><th>Name</th><th>Source</th><th>Status</th><th>Sharing</th><th>ArcGIS</th><th></th>
      </tr></thead>
      <tbody id="layers"></tbody>
    </table>
  </div>

  <h2>Data sources</h2>
  <div class="panel">
    <table>
      <thead><tr><th>Name</th><th>Kind</th><th>Layers</th></tr></thead>
      <tbody id="sources"></tbody>
    </table>
  </div>
</main>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("gis-token") || null;

// One colour per shown layer, so the legend means something.
const PALETTE = ["#0b6157", "#a63a2b", "#1f5fa8", "#92620d", "#6b3fa0", "#2f7a55"];
const shown = new Map();     // layer name -> { colour, layer }
let esri = null;             // the SDK modules, loaded once
let view = null;

function toast(message, ok = false) {
  const t = $("toast");
  t.textContent = message;
  t.className = "on " + (ok ? "good" : "bad");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => (t.className = ""), 7000);
}

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;

  const response = await fetch(path, { ...options, headers });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { /* not json */ }

  if (!response.ok) {
    // The server's own message. Every refusal in this product is written to say
    // what to do about it, and replacing that with "request failed" throws away
    // the only useful part.
    throw new Error((body && body.error && body.error.message) || `${response.status} ${path}`);
  }
  return body;
}

/**
 * Loads the SDK once and teaches it to authenticate.
 *
 * The map's requests go straight from the browser to /rest/services/… and would
 * otherwise carry no credential — so a private or organization layer would 404
 * for the map while the console can see it perfectly. ADR-015 §4's answer to
 * this in the ArcGIS world is a `token=` query parameter, which we deliberately
 * do not implement because a credential in a URL leaks into every proxy log.
 *
 * An interceptor puts it in the Authorization header instead, which is the form
 * ADR-015 §4 says clients should prefer. That it works with the real SDK is the
 * argument for not rushing `token=`.
 */
function loadEsri() {
  if (esri) return Promise.resolve(esri);

  return new Promise((resolve, reject) => {
    require([
      "esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer",
      "esri/layers/VectorTileLayer",
      "esri/layers/WebTileLayer", "esri/Basemap", "esri/config",
    ], (Map, MapView, FeatureLayer, VectorTileLayer, WebTileLayer, Basemap, config) => {
      config.request.interceptors.push({
        urls: location.origin,
        before: params => {
          params.requestOptions.headers = {
            ...(params.requestOptions.headers || {}),
            Authorization: "Bearer " + token,
          };
        },
      });

      esri = { Map, MapView, FeatureLayer, VectorTileLayer, WebTileLayer, Basemap };
      resolve(esri);
    }, reject);
  });
}

async function ensureMap() {
  const { Map, MapView, WebTileLayer, Basemap } = await loadEsri();
  if (view) return view;

  // OpenStreetMap rather than an Esri basemap: Esri's need an API key tied to
  // an ArcGIS account, which is exactly what the people this product is for do
  // not have.
  const basemap = new Basemap({
    baseLayers: [new WebTileLayer({
      urlTemplate: "https://tile.openstreetmap.org/{level}/{col}/{row}.png",
      copyright: "© OpenStreetMap contributors",
    })],
  });

  view = new MapView({
    container: "view",
    map: new Map({ basemap }),
    center: [0, 20],
    zoom: 2,
  });

  return view;
}

function symbolFor(geometryType, colour) {
  if (geometryType === "esriGeometryPolygon") {
    return { type: "simple-fill", color: colour + "55",
             outline: { color: colour, width: 1.6 } };
  }
  if (geometryType === "esriGeometryPolyline") {
    return { type: "simple-line", color: colour, width: 2.4 };
  }
  return { type: "simple-marker", size: 9, color: colour,
           outline: { color: "#fff", width: 1.2 } };
}

function drawLegend() {
  $("legend").innerHTML = shown.size === 0
    ? '<span class="sub">Nothing shown. Use Show next to a service.</span>'
    : [...shown.entries()].map(([name, s]) =>
        `<span><i class="swatch" style="background:${s.colour}"></i>${name}</span>`).join("");
}

// Tiles, through Esri's own VectorTileLayer rather than anything of ours.
//
// This is the only check that A-057 actually names: that the ST_AsMVT output
// is acceptable to a real client. Rendering a tile ourselves proved the
// geometry is right, which is a different and smaller claim — our decoder and
// our encoder could agree about a mistake, and a client that refuses the
// service is a service nobody can use no matter how correct the bytes are.
async function showTiles(name) {
  const { VectorTileLayer } = await loadEsri();
  const mapView = await ensureMap();

  const layer = new VectorTileLayer({
    url: `${serviceRoot(layerNamed(name))}/VectorTileServer`,
    title: `${name} (tiles)`,
  });

  mapView.map.add(layer);
  shown.set(tileKey(name), { colour: TILE_COLOUR, layer, tiles: true });
  drawLegend();
  $("mapPanel").classList.add("on");

  try {
    await layer.when();
    if (layer.fullExtent) await mapView.goTo(layer.fullExtent.expand(1.2));
  } catch (e) {
    hide(tileKey(name));
    toast(`${name} tiles: ${e.message || e}`);
  }
}

const tileKey = name => `${name} · tiles`;
const TILE_COLOUR = "#8fb8cc";

// Hosted services live under /rest/services/hosted and registered ones do
// not. The server redirects the wrong path, so building the wrong URL still
// works — but it costs a round trip on every request, and a console that
// relies on a compatibility redirect is a console teaching the wrong shape.
function serviceRoot(layer) {
  const folder = layer.hosted ? "hosted/" : "";
  return `${location.origin}/rest/services/${folder}${encodeURIComponent(layer.name)}`;
}

async function show(name, geometryType) {
  const { FeatureLayer } = await loadEsri();
  const mapView = await ensureMap();

  const colour = PALETTE[shown.size % PALETTE.length];

  const layer = new FeatureLayer({
    url: `${serviceRoot(layerNamed(name))}/FeatureServer/0`,
    title: name,
    outFields: ["*"],
    renderer: { type: "simple", symbol: symbolFor(geometryType, colour) },
    popupTemplate: { title: name, content: "{*}" },
  });

  mapView.map.add(layer);
  shown.set(name, { colour, layer });
  drawLegend();
  $("mapPanel").classList.add("on");

  try {
    await layer.when();

    // Zoom to the layer just shown. fullExtent comes from the layer document,
    // which this server fills from PostGIS statistics — so it may be absent,
    // and an absent extent is said out loud rather than left as a map that
    // quietly did not move.
    if (layer.fullExtent) {
      await mapView.goTo(layer.fullExtent.expand(1.4));
    } else {
      toast(`${name} is shown, but its extent is unknown so the map did not move. `
        + "Run ANALYZE on the source table and reload.");
    }
  } catch (e) {
    // The SDK reports a refused request here, and the server's message is the
    // useful part — a stopped service, a layer not shared, a parameter refused.
    hide(name);
    toast(`${name}: ${e.message || e}`);
  }
}

function hide(name) {
  const entry = shown.get(name);
  if (!entry) return;
  if (view) view.map.remove(entry.layer);
  shown.delete(name);
  drawLegend();
  if (shown.size === 0) $("mapPanel").classList.remove("on");
}

async function refreshHealth() {
  try {
    const h = await api("/admin/health");
    $("health").textContent = h.status === "ok"
      ? "platform store reachable"
      : "DEGRADED — platform store unreachable";
  } catch { $("health").textContent = "unreachable"; }
}

async function whoami() {
  const me = await api("/rest/whoami");
  $("who").textContent = me.authenticated
    ? `${me.name} · ${me.roles.join(", ") || "no roles"} · ${me.userType}`
    : "anonymous";
  return me;
}

const pill = value => `<span class="pill p-${value}">${value}</span>`;

// The last listing, so serviceRoot can tell hosted from registered without a
// second request. Refreshed by every loadLayers, which runs after any change.
let known = [];
const layerNamed = name => known.find(l => l.name === name) || { name, hosted: false };

async function loadLayers() {
  const { layers } = await api("/admin/layers");
  known = layers;

  $("layers").innerHTML = layers.map(l => {
    const isShown = shown.has(l.name);
    const tilesShown = shown.has(tileKey(l.name));
    const stopped = l.status === "stopped";
    const swatch = isShown
      ? `<i class="swatch" style="background:${shown.get(l.name).colour}"></i>` : "";

    return `<tr>
      <td>
        <button data-show="${l.name}" class="${isShown ? "on" : ""}"
          ${stopped ? "disabled title='A stopped service answers 503, so there is nothing to draw.'" : ""}>
          ${isShown ? "Hide" : "Show"}
        </button>
        ${l.hosted ? `<button data-tiles="${l.name}" class="${tilesShown ? "on" : ""}"
          ${stopped ? "disabled" : ""}
          title="Draw this as vector tiles, through Esri's VectorTileLayer.">
          ${tilesShown ? "Hide tiles" : "Tiles"}
        </button>` : `<button disabled
          title="Tiles come only from hosted data — data this server owns as system of record (Q-67). This layer is registered, so it has a FeatureServer and no VectorTileServer.">
          no tiles
        </button>`}
      </td>
      <td><b class="${isShown ? "zoom" : ""}" data-zoom="${isShown ? l.name : ""}"
             style="${isShown ? "cursor:pointer" : ""}"
             title="${isShown ? "Zoom to this layer" : ""}">${swatch}${l.name}</b></td>
      <td class="sub">${l.dataSource} · ${l.table}</td>
      <td>${pill(l.status)}</td>
      <td>${pill(l.sharing)}</td>
      <td class="sub">${l.arcGisServable ? "yes" : "no object id"}</td>
      <td style="text-align:right; white-space:nowrap">
        <button data-toggle="${l.name}" data-to="${stopped ? "start" : "stop"}">
          ${stopped ? "Start" : "Stop"}
        </button>
        <select data-share="${l.name}">
          ${["private", "organization", "public"].map(s =>
            `<option value="${s}"${s === l.sharing ? " selected" : ""}>${s}</option>`).join("")}
        </select>
      </td>
    </tr>`;
  }).join("");
}

async function loadSources() {
  const { dataSources } = await api("/admin/datasources");
  $("sources").innerHTML = dataSources.map(d =>
    `<tr><td><b>${d.name}</b></td><td class="sub">${d.kind}</td>
     <td class="sub">${d.layerCount}</td></tr>`).join("");
}

document.addEventListener("click", async event => {
  const tilesName = event.target.dataset?.tiles;
  if (tilesName) {
    if (shown.has(tileKey(tilesName))) hide(tileKey(tilesName));
    else await showTiles(tilesName);
    await loadLayers();
    return;
  }

  // Clicking a shown layer's name re-frames the map on it, which is what you
  // want once several are up.
  const zoomName = event.target.dataset?.zoom;
  if (zoomName && shown.has(zoomName) && view) {
    const { layer } = shown.get(zoomName);
    if (layer.fullExtent) { await view.goTo(layer.fullExtent.expand(1.4)); }
    else { toast(`${zoomName} has no known extent.`); }
    return;
  }

  const showName = event.target.dataset?.show;
  if (showName) {
    if (shown.has(showName)) { hide(showName); await loadLayers(); return; }
    event.target.disabled = true;
    try {
      // The geometry type comes from the layer document, which is what the SDK
      // will read anyway — asking first only chooses the symbol.
      const doc = await api(
        `${serviceRoot(layerNamed(showName)).replace(location.origin, "")}/FeatureServer/0?f=json`);
      await show(showName, doc.geometryType);
    } catch (e) { toast(e.message); }
    await loadLayers();
    return;
  }

  const toggle = event.target.dataset?.toggle;
  if (toggle) {
    event.target.disabled = true;
    try {
      const r = await api(`/admin/layers/${encodeURIComponent(toggle)}/${event.target.dataset.to}`,
        { method: "POST" });
      if (r.to === "stopped") hide(toggle);
      toast(`${toggle}: ${r.from} → ${r.to}. ${r.note}`, true);
    } catch (e) { toast(e.message); }
    await loadLayers();
  }
});

document.addEventListener("change", async event => {
  const share = event.target.dataset?.share;
  if (!share) return;
  try {
    const r = await api(`/admin/layers/${encodeURIComponent(share)}/sharing`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sharing: event.target.value }),
    });
    toast(`${share}: shared ${r.from} → ${r.to}`, true);
  } catch (e) { toast(e.message); }
  await loadLayers();
});

$("go").addEventListener("click", async () => {
  try {
    const r = await api("/rest/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("u").value, password: $("p").value }),
    });
    token = r.token;
    sessionStorage.setItem("gis-token", token);
    await start();
  } catch (e) { toast(e.message); }
});

$("signout").addEventListener("click", async () => {
  try { await api("/rest/auth/logout", { method: "POST" }); } catch { /* already gone */ }
  token = null;
  sessionStorage.removeItem("gis-token");
  location.reload();
});

async function start() {
  const me = await whoami();
  if (!me.authenticated) { $("signin").style.display = ""; $("app").style.display = "none"; return; }

  $("signin").style.display = "none";
  $("app").style.display = "";
  $("signout").style.display = "";
  drawLegend();
  await Promise.all([refreshHealth(), loadLayers(), loadSources()]);
}

start().catch(e => toast(e.message));
</script>
</body>
</html>
