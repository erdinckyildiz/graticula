<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gis-server console</title>

<!--
  ADR-020 §2. This console may use no capability the admin API does not expose:
  it is static files and fetch, it holds the same session token any client would,
  and it is refused by the same privilege checks. Every action here is
  reproducible with curl, which is the test of whether the constraint held.

  No build step, no framework, no npm — A-055. The trade is a large file for a
  small supply chain, and it reverses at some size.

  The map is esri-leaflet, which is Apache-2.0. The ArcGIS Maps SDK for
  JavaScript would also work and is not open source, which is a strange thing to
  require of people who came here to avoid Esri licensing (ADR-020 §4).
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<style>
  :root {
    --paper: #f5f8f6; --surface: #fff; --surface-2: #eff4f1;
    --ink: #0f1e1b; --muted: #576a66; --rule: #d7e0dc;
    --accent: #0b6157; --ok: #2f7a55; --stop: #92620d; --alert: #a63a2b;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0c1413; --surface: #121b1a; --surface-2: #172220;
      --ink: #e3ece8; --muted: #8fa29d; --rule: #24322f;
      --accent: #4fb5a6; --ok: #56a97c; --stop: #c7962f; --alert: #d9705d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .who { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em;
       color: var(--muted); font-weight: 600; margin: 26px 0 10px; }
  h2:first-child { margin-top: 0; }

  .panel { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em;
       text-transform: uppercase; color: var(--muted); font-weight: 400;
       padding: 10px 13px; background: var(--surface-2); border-bottom: 1px solid var(--rule); }
  td { padding: 10px 13px; border-top: 1px solid var(--rule); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  td.name { font-weight: 600; cursor: pointer; }
  td.name:hover { color: var(--accent); text-decoration: underline; }
  .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .pill { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
          letter-spacing: .05em; padding: 3px 7px; border-radius: 2px;
          border: 1px solid; display: inline-block; white-space: nowrap; }
  .p-started { color: var(--ok); border-color: var(--ok); }
  .p-stopped { color: var(--stop); border-color: var(--stop); }
  .p-public { color: var(--accent); border-color: var(--accent); }
  .p-org, .p-private { color: var(--muted); border-color: var(--rule); }

  button, select {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 3px;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  input { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 3px;
          border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }

  #map { height: 420px; border-top: 1px solid var(--rule); }
  #detail { display: none; }
  #detail.on { display: block; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
  .meta div { background: var(--surface); padding: 10px 13px; }
  .meta .k { font-family: var(--mono); font-size: 10px; letter-spacing: .09em;
             text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px; }
  .meta .v { font-size: 14px; }

  #toast { position: fixed; right: 20px; bottom: 20px; max-width: 460px; z-index: 2000;
           background: var(--surface); border: 1px solid var(--rule); border-left-width: 3px;
           border-radius: 3px; padding: 12px 15px; font-size: 13.5px; display: none;
           box-shadow: 0 10px 28px -14px rgba(0,0,0,.5); }
  #toast.on { display: block; }
  #toast.bad { border-left-color: var(--alert); }
  #toast.good { border-left-color: var(--ok); }

  #signin { max-width: 380px; margin: 90px auto; }
  #signin .panel { padding: 22px; }
  #signin label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  #signin input { width: 100%; }
  #signin button { width: 100%; margin-top: 18px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>gis-server</h1>
  <span class="sub" id="health">checking…</span>
  <span class="who" id="who"></span>
  <button id="signout" style="display:none">Sign out</button>
</header>

<div id="signin" class="wrap">
  <div class="panel">
    <b>Sign in</b>
    <label for="u">Name</label><input id="u" autocomplete="username">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
    <button class="primary" id="go">Sign in</button>
    <p class="hint">
      Everything below is the admin API. Nothing here can do anything
      <code>curl</code> could not.
    </p>
  </div>
</div>

<main class="wrap" id="app" style="display:none">
  <h2>Services</h2>
  <div class="panel">
    <table>
      <thead><tr>
        <th>Name</th><th>Source</th><th>Status</th><th>Sharing</th><th>ArcGIS</th><th></th>
      </tr></thead>
      <tbody id="layers"></tbody>
    </table>
  </div>

  <div id="detail">
    <h2 id="detailName">Service</h2>
    <div class="panel">
      <div class="meta" id="detailMeta"></div>
      <div id="map"></div>
    </div>
  </div>

  <h2>Data sources</h2>
  <div class="panel">
    <table>
      <thead><tr><th>Name</th><th>Kind</th><th>Layers</th></tr></thead>
      <tbody id="sources"></tbody>
    </table>
  </div>
</main>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("gis-token") || null;
let map = null, preview = null;

function toast(message, ok = false) {
  const t = $("toast");
  t.textContent = message;
  t.className = "on " + (ok ? "good" : "bad");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => (t.className = ""), 6000);
}

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;

  const response = await fetch(path, { ...options, headers });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { /* not json */ }

  if (!response.ok) {
    // The server's own message, not a generic one. Every refusal in this
    // product is written to say what to do about it, and swallowing that in
    // favour of "request failed" would waste the only useful part.
    throw new Error((body && body.error && body.error.message) || `${response.status} ${path}`);
  }
  return body;
}

async function refreshHealth() {
  try {
    const h = await api("/admin/health");
    $("health").textContent =
      h.status === "ok" ? "platform store reachable" : "DEGRADED — platform store unreachable";
  } catch { $("health").textContent = "unreachable"; }
}

async function whoami() {
  const me = await api("/rest/whoami");
  $("who").textContent = me.authenticated
    ? `${me.name} · ${me.roles.join(", ") || "no roles"} · ${me.userType}`
    : "anonymous";
  return me;
}

const pill = (value, kind) => `<span class="pill p-${value}">${value}</span>`;

async function loadLayers() {
  const { layers } = await api("/admin/layers");
  $("layers").innerHTML = layers.map(l => `
    <tr>
      <td class="name" data-open="${l.name}">${l.name}</td>
      <td class="sub">${l.dataSource} · ${l.table}</td>
      <td>${pill(l.status)}</td>
      <td>${pill(l.sharing)}</td>
      <td class="sub">${l.arcGisServable ? "yes" : "no object id"}</td>
      <td style="text-align:right; white-space:nowrap">
        <button data-toggle="${l.name}" data-to="${l.status === "started" ? "stop" : "start"}">
          ${l.status === "started" ? "Stop" : "Start"}
        </button>
        <select data-share="${l.name}">
          ${["private", "organization", "public"]
            .map(s => `<option value="${s}"${s === l.sharing ? " selected" : ""}>${s}</option>`)
            .join("")}
        </select>
      </td>
    </tr>`).join("");
}

async function loadSources() {
  const { dataSources } = await api("/admin/datasources");
  $("sources").innerHTML = dataSources.map(d => `
    <tr><td><b>${d.name}</b></td><td class="sub">${d.kind}</td><td class="sub">${d.layerCount}</td></tr>
  `).join("");
}

/**
 * Opens a service using only what a client would have: the layer document.
 * If this can draw it, so can ArcGIS Pro.
 */
async function open(name) {
  const doc = await api(`/rest/services/${encodeURIComponent(name)}/FeatureServer/0?f=json`);

  $("detailName").textContent = name;
  $("detail").classList.add("on");
  $("detailMeta").innerHTML = [
    ["geometry", doc.geometryType.replace("esriGeometry", "")],
    ["object id", doc.objectIdField || "none"],
    ["fields", doc.fields.length],
    ["capabilities", doc.capabilities],
    ["max records", doc.maxRecordCount],
    ["extent", doc.extent ? "known" : "unknown"],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  if (!map) {
    map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  }
  if (preview) { map.removeLayer(preview); preview = null; }

  preview = L.esri.featureLayer({
    url: `${location.origin}/rest/services/${encodeURIComponent(name)}/FeatureServer/0`,
    pointToLayer: (g, latlng) => L.circleMarker(latlng,
      { radius: 7, color: "#0b6157", weight: 2, fillColor: "#4fb5a6", fillOpacity: .8 }),
  });
  preview.on("requesterror", e => toast("The map client could not read the service: " + (e.message || "")));
  preview.addTo(map);

  setTimeout(() => map.invalidateSize(), 50);
  preview.once("load", () => {
    const b = preview.getBounds();
    if (b && b.isValid()) map.fitBounds(b.pad(0.35));
  });
}

async function refresh() {
  await Promise.all([refreshHealth(), loadLayers(), loadSources()]);
}

document.addEventListener("click", async event => {
  const openName = event.target.dataset?.open;
  if (openName) { try { await open(openName); } catch (e) { toast(e.message); } return; }

  const toggle = event.target.dataset?.toggle;
  if (toggle) {
    const action = event.target.dataset.to;
    event.target.disabled = true;
    try {
      const r = await api(`/admin/layers/${encodeURIComponent(toggle)}/${action}`, { method: "POST" });
      toast(`${toggle}: ${r.from} → ${r.to}. ${r.note}`, true);
      await loadLayers();
    } catch (e) { toast(e.message); event.target.disabled = false; }
  }
});

document.addEventListener("change", async event => {
  const share = event.target.dataset?.share;
  if (!share) return;
  try {
    const r = await api(`/admin/layers/${encodeURIComponent(share)}/sharing`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sharing: event.target.value }),
    });
    toast(`${share}: shared ${r.from} → ${r.to}`, true);
    await loadLayers();
  } catch (e) { toast(e.message); await loadLayers(); }
});

$("go").addEventListener("click", async () => {
  try {
    const r = await api("/rest/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("u").value, password: $("p").value }),
    });
    token = r.token;
    sessionStorage.setItem("gis-token", token);
    await start();
  } catch (e) { toast(e.message); }
});

$("signout").addEventListener("click", async () => {
  try { await api("/rest/auth/logout", { method: "POST" }); } catch { /* already gone */ }
  token = null;
  sessionStorage.removeItem("gis-token");
  location.reload();
});

async function start() {
  const me = await whoami();
  if (!me.authenticated) { $("signin").style.display = ""; $("app").style.display = "none"; return; }
  $("signin").style.display = "none";
  $("app").style.display = "";
  $("signout").style.display = "";
  await refresh();
}

start().catch(e => toast(e.message));
</script>
</body>
</html>
