<!doctype html>
<!-- ADR-280 condition 1, disposable: what SDK 5.2 makes of a 3D object scene layer whose associated layer is the stub's
     fake multipatch layer. Every finding is posted to /report. -->
<meta charset="utf-8">
<title>Mesh editing prototype</title>
<link rel="stylesheet" href="https://js.arcgis.com/5.2/esri/themes/light/main.css">
<style>html, body, #v { margin: 0; width: 100%; height: 100%; } #e { position: absolute; right: 0; top: 0; width: 320px; }</style>
<div id="v"></div><div id="e"></div>
<script type="module" src="https://js.arcgis.com/5.2/core.js"></script>
<script>
const report = { steps: [] };
const say = (step, value) => { report.steps.push({ step, value }); };
const within = (p, ms, what) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(what + " did not settle in " + ms + " ms")), ms))]);
const send = () => fetch("/report", { method: "POST", body: JSON.stringify(report, null, 1) });
window.onerror = (m) => say("window error", String(m));
window.addEventListener("load", async () => {
  const item = new URLSearchParams(location.search).get("item");
  try {
    const [WebScene, SceneView, SceneLayer, Editor, Mesh, Point, Graphic, kernel, reactiveUtils] = await $arcgis.import([
      "@arcgis/core/WebScene.js", "@arcgis/core/views/SceneView.js", "@arcgis/core/layers/SceneLayer.js",
      "@arcgis/core/widgets/Editor.js", "@arcgis/core/geometry/Mesh.js", "@arcgis/core/geometry/Point.js",
      "@arcgis/core/Graphic.js", "@arcgis/core/kernel.js", "@arcgis/core/core/reactiveUtils.js"]);
    const [PortalItem, Portal] = await $arcgis.import(["@arcgis/core/portal/PortalItem.js", "@arcgis/core/portal/Portal.js"]);
    say("sdk", kernel.fullVersion);
    say("item param", item);
    const [Layer] = await $arcgis.import(["@arcgis/core/layers/Layer.js"]);
    const layer = await Layer.fromPortalItem({ portalItem: { id: item, portal: { url: location.origin } } });
    const scene = new WebScene({ layers: [layer] });
    const view = new SceneView({ container: "v", map: scene, camera: { position: { x: 32.888, y: 39.99, z: 1500 }, tilt: 60, heading: 0 } });
    await layer.load();
    say("layer", { type: layer.type, layerType: layer.layerType ?? null, url: layer.url, editingEnabled: layer.editingEnabled,
      capabilities: layer.capabilities, effectiveCapabilities: layer.effectiveCapabilities ?? null });
    await within(reactiveUtils.whenOnce(() => layer.associatedLayer), 15000, "associatedLayer").catch(e => say("wait", e.message));
    const assoc = layer.associatedLayer;
    say("associated", assoc ? { url: assoc.url, geometryType: assoc.geometryType, loaded: assoc.loaded,
      capabilities: assoc.capabilities, infoFor3D: !!assoc.infoFor3D } : null);
    await within(view.whenLayerView(layer), 30000, "layerView").then(() => say("layerView", "made"), e => say("layerView", "error " + e.message));

    say("scene layer operations", layer.capabilities && layer.capabilities.operations);
    const editor = new Editor({ view, container: "e" });
    await new Promise(r => setTimeout(r, 10000));
    const vm = editor.viewModel;
    const items = vm.editableItems ? vm.editableItems.toArray() : [];
    say("editor", { state: vm.state, editableItems: items.map(i => ({ layer: i.layer && i.layer.title, type: i.layer && i.layer.type,
      supports: i.supports ?? null, hasCreate: i.hasCreatePermissions ?? null, hasUpdate: i.hasUpdatePermissions ?? null,
      geometryType: i.geometryType ?? null, disabled: i.isDisabled ?? null, info: i.disabledReason ?? null })),
      keys: Object.keys(vm).slice(0, 60), layerInfos: (vm.layerInfos || []).length ?? null,
      panel: document.getElementById("e").innerText.slice(0, 400) });

    // A mesh placed by code, as the Editor's create would place one: a 10 m by 20 m box at a point.
    const at = new Point({ longitude: 32.888, latitude: 40.002, z: 0 });
    const mesh = Mesh.createBox(at, { size: { width: 10, height: 20, depth: 10 } });
    const add = await within(layer.applyEdits({ addFeatures: [new Graphic({ geometry: mesh, attributes: { name: "zz proto" } })] })
      , 30000, "applyEdits add").then(r => r, e => ({ error: e.message, details: e.details ?? null }));
    say("applyEdits add", add);
    const added = add.addFeatureResults && add.addFeatureResults[0];
    if (added && !added.error) {
      // Drawn over the cache? Look at it for a while from close by, and see what the SDK asks for.
      await view.goTo({ position: { x: 32.888, y: 40.0012, z: 80 }, tilt: 60, heading: 0 }, { animate: false }).catch(() => null);
      await new Promise(r => setTimeout(r, 15000));
      say("after add, edited features", typeof layer.queryCachedStatistics === "function" ? "ok" : "n/a");
      // A move that keeps the geometry: only the attributes of the transform.
      const tmove = await within(layer.applyEdits({ updateFeatures: [new Graphic({ attributes: { OBJECTID: added.objectId, globalid: added.globalId, ESRI3DO_TX: 5 } })] }), 30000, "transform-only")
        .then(r => r, e => ({ error: e.message }));
      say("applyEdits transform-only", tmove);
      const moved = Mesh.createBox(new Point({ longitude: 32.8885, latitude: 40.002, z: 0 }), { size: { width: 10, height: 20, depth: 10 } });
      const upd = await layer.applyEdits({ updateFeatures: [new Graphic({ geometry: moved, attributes: { OBJECTID: added.objectId, globalid: added.globalId } })] })
        .then(r => r, e => ({ error: e.message }));
      say("applyEdits update", upd);
      await new Promise(r => setTimeout(r, 3000));
      const del = await layer.applyEdits({ deleteFeatures: [{ objectId: added.objectId, globalId: added.globalId }] }).then(r => r, e => ({ error: e.message }));
      say("applyEdits delete", del);
    }
  } catch (e) {
    say("failed", e.message + " " + (e.stack || "").slice(0, 400));
  }
  await send();
});
setTimeout(() => { say("page timeout", "120 s"); send(); }, 120000);
</script>
