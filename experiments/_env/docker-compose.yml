# Local experiment environment.
#
# NOT production infrastructure. This exists to unblock experiments and
# benchmarks under Phase 0 (§56). Everything here is disposable.
#
#   docker compose up -d
#   docker compose exec postgis psql -U gis -d gis
#
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: gis-experiment-postgis
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
      # Experiment box, not a production tuning exercise. These are here so
      # benchmark numbers are not dominated by an untuned default config.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB
      -c random_page_cost=1.1
      -c effective_cache_size=4GB
      -c max_connections=200
      -c log_min_duration_statement=1000
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      timeout: 5s
      retries: 20

  # GDAL/ogr2ogr and osm2pgsql, so nothing has to be installed on the host.
  # Run one-off commands with:
  #   docker compose run --rm gdal ogrinfo /data/<file>
  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    container_name: gis-experiment-gdal
    entrypoint: ["/bin/bash"]
    tty: true
    volumes:
      - ./data:/data
    depends_on:
      postgis:
        condition: service_healthy

  # osm2pgsql, in its own image so the database container stays exactly the
  # published one. Usage:
  #   docker compose run --rm osm2pgsql /work/load-osm.sh
  osm2pgsql:
    build:
      context: .
      dockerfile: osm2pgsql.Dockerfile
    container_name: gis-experiment-osm2pgsql
    environment:
      PGHOST: postgis
      PGUSER: gis
      PGPASSWORD: gis
      PGDATABASE: gis
    volumes:
      - ./data:/data
      - ./:/work
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
